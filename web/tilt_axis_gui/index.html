<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TPL — Simplified</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../../branding/export/tpl_logo_color_128.png">
<link rel="apple-touch-icon" href="../../branding/export/tpl_logo_color_256.png">
<style>
  /* Same "Hardened Control Room" design tokens as the full GUI
     (web/tilt_axis_gui_full/index.html) and the onboard kiosk
     (status.html) -- a deliberately separate copy, not a shared file
     (see status.html's own note on why this project keeps each GUI page
     fully self-contained), but the same values so all three read as one
     product. */
  @font-face {
    font-family: "PanelSans";
    src: local("Bahnschrift"), local("Bahnschrift SemiBold"), local("Arial Narrow");
    font-weight: 400 700;
  }
  :root {
    --bg: #090c0a;
    --panel: #0f1512;
    --panel-border: #2f4038;
    --text: #e4efe8;
    --text-dim: #7e9488;
    --accent: #2be381;
    --accent-dim: #123d27;
    --danger: #ef4530;
    --input-bg: #060907;
    --mono: "Consolas", "Cascadia Mono", ui-monospace, monospace;
    --rivet: radial-gradient(circle at 35% 30%, #4a5c50, #16201a 70%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PanelSans", "Segoe UI Semibold", "Arial Narrow", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    padding: 10px 16px;
    background:
      var(--rivet) 7px 7px / 5px 5px no-repeat,
      var(--rivet) calc(100% - 7px) 7px / 5px 5px no-repeat,
      var(--rivet) 7px calc(100% - 7px) / 5px 5px no-repeat,
      var(--rivet) calc(100% - 7px) calc(100% - 7px) / 5px 5px no-repeat,
      repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px, transparent 1px, transparent 3px),
      linear-gradient(180deg, #131c17, #0e1512);
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 1px 0 rgba(0,0,0,.6);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .brand-logo { height: 26px; width: auto; color: var(--accent); flex: none; }
  .conn-row { display: flex; align-items: center; gap: 6px; }
  .conn-row input { width: 170px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--danger); display: inline-block;
    box-shadow: inset 0 0 0 1px #04140b, 0 0 3px 0 var(--danger);
  }
  .dot.connected { background: var(--accent); box-shadow: inset 0 0 0 1px #04140b, 0 0 3px 0 var(--accent); }
  .spacer { flex: 1; }

  /* Large, always-visible-regardless-of-tab progress banner -- answers
     "is it still running, and roughly how far along" at a glance, direct
     copy of the full GUI's own. Hidden entirely while idle. */
  .scan-banner {
    display: none;
    position: relative;
    width: 100%;
    height: 34px;
    background: var(--input-bg);
    border-bottom: 1px solid var(--panel-border);
    overflow: hidden;
  }
  .scan-banner.visible { display: block; }
  .scan-banner-fill {
    position: absolute; top: 0; left: 0; height: 100%; width: 0%;
    background: var(--accent);
    transition: width .3s;
  }
  .scan-banner.danger .scan-banner-fill { background: var(--danger); }
  .scan-banner.indeterminate .scan-banner-fill {
    background: repeating-linear-gradient(
      115deg, var(--accent) 0px, var(--accent) 14px,
      var(--accent-dim) 14px, var(--accent-dim) 28px
    );
    animation: scan-banner-stripes 1s linear infinite;
  }
  .scan-banner.indeterminate.danger .scan-banner-fill {
    background: repeating-linear-gradient(
      115deg, var(--danger) 0px, var(--danger) 14px,
      #3a1610 14px, #3a1610 28px
    );
  }
  @keyframes scan-banner-stripes {
    from { background-position: 0 0; }
    to { background-position: 56px 0; }
  }
  .scan-banner-text {
    position: relative; z-index: 1;
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  .status-bar {
    display: flex;
    gap: 20px;
    padding: 8px 16px;
    background: #0b110e;
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 1px 0 rgba(0,0,0,.6);
    flex-wrap: wrap;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .status-bar .item { display: flex; gap: 6px; }
  .status-bar .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .07em; font-size: 11px; }
  .status-bar .val { font-weight: 700; font-family: var(--mono); color: var(--accent); }

  nav.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--panel-border); }
  nav.tabs button {
    background: transparent; border: none; color: var(--text-dim); font-family: inherit;
    padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  main { padding: 16px; max-width: 720px; margin: 0 auto 120px; }
  .tabpage { display: none; }
  .tabpage.active { display: block; }

  fieldset {
    border: 1px solid var(--panel-border);
    background:
      var(--rivet) 7px 7px / 4px 4px no-repeat,
      var(--rivet) calc(100% - 7px) 7px / 4px 4px no-repeat,
      var(--rivet) 7px calc(100% - 7px) / 4px 4px no-repeat,
      var(--rivet) calc(100% - 7px) calc(100% - 7px) / 4px 4px no-repeat,
      var(--panel);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025), inset 0 -1px 0 rgba(0,0,0,.5);
    margin: 0 0 14px 0;
    padding: 12px 14px;
  }
  legend {
    padding: 0 6px; color: var(--text-dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em; font-weight: 700;
  }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row label { color: var(--text-dim); text-transform: uppercase; font-size: 11.5px; letter-spacing: .04em; font-weight: 600; }
  .row label:not([for]):not(:first-child) { margin-left: 18px; }
  .row input[type=checkbox]:not(:first-child) { margin-left: 18px; }
  input[type=checkbox] { accent-color: var(--accent); }

  input[type=text], input[type=number], select {
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7);
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 600;
    padding: 5px 7px;
    font-size: 12.5px;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 0 0 1px var(--accent);
  }
  input[type=number] { width: 90px; }

  button {
    background: #182019;
    border: 1px solid var(--panel-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.4);
    color: var(--text);
    font-family: inherit;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  button:hover { background: #202b23; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent-dim); border-color: var(--accent); color: #c9ffe2; }
  button.primary:hover { background: #17552f; }
  button.danger { background: var(--danger); border-color: #ff7259; color: #150402; text-shadow: 0 1px 0 rgba(255,255,255,.15); }
  button.danger:hover { background: #ff5a3f; }
  button.shutdown-all { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  button.shutdown-all:hover { background: var(--danger); color: #150402; }

  .readout { font-family: var(--mono); font-weight: 600; color: var(--accent); white-space: pre-line; }
  input.wide { width: 160px; }
  /* The browser's own default [hidden]{display:none} is a UA-layer rule,
     so any author rule setting display on the same element (.row's own
     display:flex, here) silently wins the tie and the element stays
     visible -- caught live: mountCalibrationResult rendered its Apply
     button despite the hidden attribute being correctly set. */
  [hidden] { display: none !important; }

  /* Scans tab -- one .scan-entry per local file, same button look as the
     rest of the page for the Download link since <a> has none by default.
     Direct copy of the full GUI's own (web/tilt_axis_gui_full/index.html). */
  .scan-entry {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 0; border-bottom: 1px solid var(--panel-border);
  }
  .scan-entry:last-child { border-bottom: none; }
  .scan-entry .scan-name { font-family: var(--mono); font-size: 12.5px; flex: 1 1 auto; min-width: 200px; }
  .scan-entry .scan-meta { color: var(--text-dim); font-size: 11.5px; }
  .scan-entry .scan-progress { flex-basis: 100%; }
  .project-group { margin: 10px 0; border: 1px solid var(--panel-border); padding: 8px 10px; }
  .project-group-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .project-group-title {
    font-weight: 700; text-transform: uppercase; font-size: 12px;
    color: var(--accent); letter-spacing: .04em;
  }
  a.button {
    background: #182019; border: 1px solid var(--panel-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.4);
    color: var(--text); font-family: inherit; padding: 6px 12px; cursor: pointer;
    font-size: 12px; font-weight: 700; text-transform: uppercase; text-decoration: none;
  }
  a.button:hover { background: #202b23; }
  .progress-bar {
    width: 100%; height: 8px; background: var(--input-bg); overflow: hidden; border: 1px solid var(--panel-border);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7);
  }
  .progress-bar .fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .modal-error { color: var(--danger); font-size: 12px; }

  /* Settings-file browser modal -- direct copy of the full GUI's own. */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-panel {
    width: 420px; max-width: calc(100vw - 40px);
    background: var(--panel); border: 1px solid var(--panel-border);
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
  }
  .modal-panel .modal-header {
    padding: 10px 14px; border-bottom: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 8px;
  }
  .modal-panel .modal-header .modal-title {
    text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 700; color: var(--text-dim);
  }
  .modal-panel .modal-path {
    padding: 8px 14px; display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--panel-border);
  }
  .modal-panel .modal-path input { flex: 1; min-width: 0; }
  .modal-panel .modal-list {
    height: 340px; overflow-y: auto; border-bottom: 1px solid var(--panel-border);
    scrollbar-color: var(--panel-border) var(--input-bg);
    scrollbar-width: auto;
  }
  .modal-panel .modal-list::-webkit-scrollbar { width: 12px; }
  .modal-panel .modal-list::-webkit-scrollbar-track { background: var(--input-bg); }
  .modal-panel .modal-list::-webkit-scrollbar-thumb { background: var(--panel-border); border: 2px solid var(--input-bg); }
  .modal-panel .modal-count {
    padding: 4px 14px; font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .modal-panel .modal-error { color: var(--danger); font-size: 12px; padding: 0 14px; }
  .modal-panel .modal-footer {
    padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  .controls-feedback {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 8px 16px;
    background: #0b110e;
    border-top: 1px solid var(--panel-border);
    font-size: 12px; color: var(--text-dim); font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .controls-feedback.danger { color: var(--danger); font-style: normal; }
</style>
</head>
<body>

<header>
  <svg class="brand-logo" viewBox="0 -20 400 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="46" y1="22" x2="2" y2="30"/>
      <line x1="46" y1="22" x2="10" y2="4"/>
      <line x1="46" y1="22" x2="22" y2="-8"/>
    </g>
    <g fill="currentColor">
      <circle cx="2" cy="30" r="4.5"/>
      <circle cx="10" cy="4" r="3.5"/>
      <circle cx="22" cy="-8" r="3"/>
      <rect x="51" y="25" width="95" height="9"/>
      <rect x="40" y="40" width="104" height="10"/>
      <rect x="75" y="55" width="26" height="11"/>
      <rect x="73" y="70" width="26" height="11"/>
      <rect x="71" y="85" width="26" height="11"/>
      <rect x="69" y="100" width="26" height="11"/>
      <rect x="67" y="115" width="26" height="11"/>
      <rect x="66" y="130" width="26" height="11"/>
      <rect x="64" y="145" width="26" height="11"/>
      <rect x="62" y="160" width="26" height="11"/>
      <rect x="186" y="25" width="80" height="9"/>
      <rect x="175" y="40" width="20" height="10"/>
      <rect x="244" y="40" width="20" height="10"/>
      <rect x="168" y="55" width="26" height="11"/>
      <rect x="237" y="55" width="26" height="11"/>
      <rect x="166" y="70" width="26" height="11"/>
      <rect x="235" y="70" width="26" height="11"/>
      <rect x="164" y="85" width="95" height="11"/>
      <rect x="162" y="100" width="26" height="11"/>
      <rect x="160" y="115" width="26" height="11"/>
      <rect x="159" y="130" width="26" height="11"/>
      <rect x="157" y="145" width="26" height="11"/>
      <rect x="155" y="160" width="26" height="11"/>
      <rect x="306" y="25" width="11" height="9"/>
      <rect x="295" y="40" width="20" height="10"/>
      <rect x="288" y="55" width="26" height="11"/>
      <rect x="286" y="70" width="26" height="11"/>
      <rect x="284" y="85" width="26" height="11"/>
      <rect x="282" y="100" width="26" height="11"/>
      <rect x="280" y="115" width="26" height="11"/>
      <rect x="279" y="130" width="26" height="11"/>
      <rect x="277" y="145" width="26" height="11"/>
      <rect x="275" y="160" width="95" height="11"/>
    </g>
  </svg>
  <h1>TPL</h1>
  <div class="conn-row">
    <span id="connDot" class="dot"></span>
    <button id="connectBtn">Connect</button>
  </div>
  <div class="spacer"></div>
  <button id="releaseStallBtn">Release Stall</button>
  <button id="stopBtn" class="danger">EMERGENCY STOP</button>
  <button id="shutdownStackBtn" class="shutdown-all">Shutdown</button>
</header>

<div class="scan-banner" id="scanBanner">
  <div class="scan-banner-fill" id="scanBannerFill"></div>
  <div class="scan-banner-text" id="scanBannerText"></div>
</div>

<div class="status-bar">
  <div class="item"><span class="label">scan:</span><span class="val" id="stScan">—</span></div>
  <div class="item"><span class="label">tilt state:</span><span class="val" id="stState">—</span></div>
  <div class="item"><span class="label">position (deg):</span><span class="val readout" id="stPosition">—</span></div>
  <div class="item"><span class="label">motor status:</span><span class="val" id="stMotorStatus">—</span></div>
  <div class="item"><span class="label">enable:</span><span class="val" id="stEnable">—</span></div>
  <div class="item"><span class="label">speed:</span><span class="val" id="stSpeed">—</span></div>
  <div class="item"><span class="label">stall:</span><span class="val" id="stStall">—</span></div>
</div>

<nav class="tabs">
  <button data-tab="config" class="active">Config</button>
  <button data-tab="scans">Scans</button>
  <button data-tab="settings">Settings</button>
</nav>

<main>

  <!-- ============================ CONFIG ============================ -->
  <div class="tabpage active" id="tab-config">
    <fieldset>
      <legend>Project</legend>
      <div class="row">
        <select id="projectSelect"><option value="">(no project)</option></select>
        <button id="newProjectBtn">New Project&hellip;</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Scan preset</legend>
      <div class="row">
        <select id="scanPresetSelect"><option value="">(no presets saved)</option></select>
        <button id="loadScanPresetBtn">Load</button>
        <button id="saveScanPresetBtn">Save As New&hellip;</button>
        <button id="deleteScanPresetBtn" class="danger">Delete</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Scan mode</legend>
      <div class="row">
        <label>Mode</label>
        <select id="scanModeSelect">
          <option value="stare">Step-and-stare</option>
          <option value="sweep">Continuous sweep</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="tabpage active" id="mode-group-stare">
      <legend>Step-and-stare range &amp; capture</legend>
      <div class="row">
        <label>Start (deg)</label>
        <input id="scanStartDeg" type="number" step="1" value="5">
        <label>End (deg)</label>
        <input id="scanEndDeg" type="number" step="1" value="235">
        <label>Step (deg)</label>
        <input id="scanStepDeg" type="number" step="0.5" value="2">
      </div>
      <div class="row">
        <label>Revolutions/stop</label>
        <input id="scanRevsPerStop" type="number" step="1" value="2">
        <label>Extra settle (s)</label>
        <input id="scanSettleExtra" type="number" step="0.1" value="0.5">
      </div>
    </fieldset>

    <fieldset class="tabpage" id="mode-group-sweep">
      <legend>Continuous sweep scan</legend>
      <div class="row">
        <label>Min (deg)</label>
        <input id="sweepScanMinDeg" type="number" step="1" value="0">
        <label>Max (deg)</label>
        <input id="sweepScanMaxDeg" type="number" step="1" value="30">
      </div>
      <div class="row">
        <label>Speed (RPM, max 40)</label>
        <input id="sweepScanSpeedRpm" type="number" max="40" value="40">
        <label>Accel (0-255)</label>
        <input id="sweepScanAccel" type="number" value="2">
      </div>
      <div class="row">
        <label>Duration (s, 0 = until stopped)</label>
        <input id="sweepScanDurationS" type="number" step="1" value="0">
      </div>
      <div class="row">
        <label>Edge margin (deg, 0 = off)</label>
        <input id="sweepScanEdgeMarginDeg" type="number" step="1" value="5">
      </div>
      <div class="row">
        <input type="checkbox" id="sweepEnableDeskew"><label for="sweepEnableDeskew">Per-point deskew</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Live coverage</legend>
      <div class="row" style="flex-direction: row; align-items: center; gap: 14px; justify-content: flex-start;">
        <canvas id="coverageCanvas" width="260" height="260" style="width: 140px; height: 140px; flex: none;"></canvas>
        <span class="readout" id="coverageSummary">—</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Run</legend>
      <div class="row">
        <button id="startScanBtn" class="primary">Start Scan</button>
        <button id="stopScanBtn" class="danger">Stop Scan</button>
        <button id="previewSweepBtn">Preview Sweep</button>
        <button id="stopPreviewSweepBtn" disabled>Stop Preview</button>
      </div>
      <div class="row">
        <span class="readout" id="previewSweepStatus"></span>
      </div>
    </fieldset>
  </div>

  <!-- ============================ SCANS ============================ -->
  <div class="tabpage" id="tab-scans">
    <fieldset>
      <legend>Local scans</legend>
      <div class="row">
        <button id="refreshScansBtn">Refresh</button>
        <span class="readout" id="scansFreeSpace">—</span>
      </div>
      <div id="scansList"></div>
      <div class="modal-error" id="scansListError"></div>
    </fieldset>
  </div>

  <!-- ============================ SETTINGS ============================ -->
  <div class="tabpage" id="tab-settings">
    <fieldset>
      <legend>Settings</legend>
      <div class="row">
        <button id="saveSettingsAsBtn">Save Settings As&hellip;</button>
        <button id="loadSettingsBtn">Load Settings&hellip;</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Mount calibration</legend>
      <div class="row">
        <button id="calibrateMountBtn">Calibrate Mount</button>
        <button id="calibrateAndApplyMountBtn" class="primary">Calibrate &amp; Apply</button>
      </div>
      <div class="row" id="mountCalibrationResult" hidden>
        <span class="readout" id="mountCalibrationSummary"></span>
        <button id="applyMountCalibrationBtn" class="primary">Apply</button>
      </div>
      <div class="modal-error" id="mountCalibrationError"></div>
    </fieldset>

    <fieldset>
      <legend>Config preset</legend>
      <div class="row">
        <select id="configPresetSelect"><option value="">(no presets saved)</option></select>
        <button id="loadConfigPresetBtn">Load</button>
        <button id="saveConfigPresetBtn">Save As New&hellip;</button>
        <button id="deleteConfigPresetBtn" class="danger">Delete</button>
      </div>
    </fieldset>
  </div>

</main>

<div class="controls-feedback" id="controlsFeedback"></div>

<!-- Settings-file browser modal -- direct copy of the full GUI's own,
     backs Save Settings As/Load Settings. -->
<div class="modal-overlay" id="settingsFileModal">
  <div class="modal-panel">
    <div class="modal-header">
      <span class="modal-title" id="settingsFileModalTitle">Load Settings</span>
      <span class="spacer"></span>

<script>
'use strict';

// ---- Minimal rosbridge client -- same protocol/shape as the full GUI's
// own (web/tilt_axis_gui_full/index.html), kept as a separate copy on
// purpose (see status.html's own note: every GUI page here is a single
// self-contained file, nothing shared/imported). Includes the same
// fragment-reassembly fix the full GUI carries -- this page doesn't
// currently subscribe to anything large enough to need it, but it's
// cheap correctness to keep rather than a reason to drop it. ----

class RosBridge {
  constructor() {
    this.ws = null;
    this.advertised = new Set();
    this.subscriptions = new Map();
    this.pendingServices = new Map();
    this._idCounter = 0;
    this._fragments = new Map();
  }

  connect(url) {
    return new Promise((resolve, reject) => {
      this.ws = new WebSocket(url);
      this.ws.onopen = () => resolve();
      this.ws.onerror = (e) => reject(e);
      this.ws.onclose = () => { if (this.onClose) this.onClose(); };
      this.ws.onmessage = (evt) => this._onMessage(evt);
    });
  }

  disconnect() {
    if (this.ws) this.ws.close();
    this.ws = null;
  }

  get connected() {
    return this.ws && this.ws.readyState === WebSocket.OPEN;
  }

  _send(obj) {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
      throw new Error('not connected to rosbridge');
    }
    this.ws.send(JSON.stringify(obj));
  }

  _nextId() {
    this._idCounter += 1;
    return 'req_' + this._idCounter;
  }

  subscribe(topic, type, cb) {
    if (!this.subscriptions.has(topic)) {
      this.subscriptions.set(topic, []);
      this._send({ op: 'subscribe', topic, type });
    }
    this.subscriptions.get(topic).push(cb);
  }

  publish(topic, type, msg) {
    const key = topic + '|' + type;
    if (!this.advertised.has(key)) {
      this._send({ op: 'advertise', topic, type });
      this.advertised.add(key);
    }
    this._send({ op: 'publish', topic, msg });
  }

  callService(service, type, args, timeoutMs = 3000) {
    const id = this._nextId();
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        this.pendingServices.delete(id);
        reject(new Error('service call timed out: ' + service));
      }, timeoutMs);
      this.pendingServices.set(id, { resolve, reject, timer });
      this._send({ op: 'call_service', service, type, args, id });
    });
  }

  _onMessage(evt) {
    let msg;
    try {
      msg = JSON.parse(evt.data);
    } catch (e) {
      return;
    }
    if (msg.op === 'fragment') {
      this._handleFragment(msg);
      return;
    }
    this._dispatch(msg);
  }

  _handleFragment(frag) {
    let entry = this._fragments.get(frag.id);
    if (!entry) {
      entry = { total: frag.total, parts: new Array(frag.total), received: 0 };
      this._fragments.set(frag.id, entry);
    }
    entry.parts[frag.num] = frag.data;
    entry.received += 1;
    if (entry.received >= entry.total) {
      this._fragments.delete(frag.id);
      let full;
      try {
        full = JSON.parse(entry.parts.join(''));
      } catch (e) {
        return;
      }
      this._dispatch(full);
    }
  }

  _dispatch(msg) {
    if (msg.op === 'publish') {
      const cbs = this.subscriptions.get(msg.topic);
      if (cbs) cbs.forEach((cb) => cb(msg.msg));
    } else if (msg.op === 'service_response') {
      const pending = this.pendingServices.get(msg.id);
      if (pending) {
        clearTimeout(pending.timer);
        this.pendingServices.delete(msg.id);
        if (msg.result === false) {
          pending.reject(new Error('service call failed: ' + msg.service));
        } else {
          pending.resolve(msg.values);
        }
      }
    }
  }
}

const bridge = new RosBridge();
const feedbackEl = document.getElementById('controlsFeedback');

function setFeedback(text, isError) {
  feedbackEl.textContent = text;
  feedbackEl.classList.toggle('danger', !!isError);
}

// Fixed node names, not configurable fields in the header -- this page
// only ever talks to this one rig's own default nodes, same reasoning
// as status.html (see that file's own comment on why it doesn't have
// index.html's configurable node-name fields either).
const TILT_NODE = '/tilt_axis_bridge';
const SCAN_NODE = '/scan_aggregator';
const VLP16_NODE = '/vlp16_config';
function node() { return TILT_NODE; }
function scanNode() { return SCAN_NODE; }
function vlp16Node() { return VLP16_NODE; }

function degToRad(deg) { return (deg * Math.PI) / 180; }
function radToDeg(rad) { return (rad * 180) / Math.PI; }
function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

// Per rcl_interfaces/msg/ParameterType.
const PARAMETER_BOOL = 1;
const PARAMETER_INTEGER = 2;
const PARAMETER_DOUBLE = 3;
const PARAMETER_STRING = 4;

// ---- Generic driver_command / driver_response round trip (backs
// Release Stall and the top status-bar's motor-status polling) ----

const pendingDriverCommands = new Map();
let driverResponseSubscribed = false;
let driverCmdCounter = 0;

function ensureDriverResponseSubscription() {
  if (driverResponseSubscribed) return;
  driverResponseSubscribed = true;
  bridge.subscribe(TILT_NODE + '/driver_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingDriverCommands.get(resp.id);
    if (pending) {
      pendingDriverCommands.delete(resp.id);
      clearTimeout(pending.timer);
      if (resp.success) pending.resolve(resp.result);
      else pending.reject(new Error(resp.error || 'command failed'));
    }
  });
}

function sendDriverCommand(command, params) {
  ensureDriverResponseSubscription();
  const id = 'cmd_' + (++driverCmdCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingDriverCommands.delete(id);
      reject(new Error('timed out: ' + command));
    }, 3000);
    pendingDriverCommands.set(id, { resolve, reject, timer });
    bridge.publish(TILT_NODE + '/driver_command', 'std_msgs/msg/String', {
      data: JSON.stringify({ id, command, params }),
    });
  });
}

document.getElementById('releaseStallBtn').addEventListener('click', async () => {
  try {
    await sendDriverCommand('release_stall', {});
    setFeedback('release_stall sent');
  } catch (e) {
    setFeedback('release_stall failed: ' + e.message, true);
  }
});

// ---- Top status-bar: tilt state/position (direct subscriptions) and
// motor status/enable/speed/stall (polled via driver_command, same
// self-rescheduling-loop reasoning as the full GUI's own copy -- a fixed
// setInterval would let a slow round-trip's backlog compound). ----

function subscribeStatusTopics() {
  bridge.subscribe(TILT_NODE + '/status', 'std_msgs/msg/String', (msg) => {
    document.getElementById('stState').textContent = msg.data;
  });
  bridge.subscribe(TILT_NODE + '/joint_state', 'sensor_msgs/msg/JointState', (msg) => {
    if (msg.position && msg.position.length) {
      document.getElementById('stPosition').textContent = radToDeg(msg.position[0]).toFixed(2);
    }
  });
}

let lastScanStatusText = 'idle';
// Parses scan_aggregator's ~/status text into what the banner below
// needs -- direct copy of the full GUI's own parseScanStatus/
// updateScanProgress (minus the small in-tab progress bar, which this
// page doesn't have; the banner is the only progress display here).
function parseScanStatus(text) {
  const stepMatch = /^(moving|capturing|settling_extra) \((\d+)\/(\d+)/.exec(text);
  if (stepMatch) {
    return {
      visible: true, indeterminate: false,
      fraction: parseInt(stepMatch[2], 10) / parseInt(stepMatch[3], 10),
      label: stepMatch[1].replace(/_/g, ' ').toUpperCase(), danger: false,
    };
  }
  if (text.startsWith('sweep_scanning')) {
    if (text.includes('no duration set')) {
      return { visible: true, indeterminate: true, fraction: 0, label: 'SWEEPING (UNBOUNDED)', danger: false };
    }
    if (text.includes('moving to start')) {
      return { visible: true, indeterminate: true, fraction: 0, label: 'MOVING TO SWEEP START', danger: false };
    }
    const remainingMatch = /\((\d+)s left/.exec(text);
    const totalEl = document.getElementById('sweepScanDurationS');
    const total = totalEl ? parseFloat(totalEl.value) : 0;
    if (remainingMatch && total > 0) {
      const remaining = parseInt(remainingMatch[1], 10);
      return {
        visible: true, indeterminate: false,
        fraction: Math.min(1, Math.max(0, 1 - remaining / total)),
        label: 'SWEEPING', danger: false,
      };
    }
    return { visible: true, indeterminate: true, fraction: 0, label: 'SWEEPING', danger: false };
  }
  if (text.startsWith('saving')) {
    return { visible: true, indeterminate: true, fraction: 1, label: 'SAVING TO DISK', danger: false };
  }
  if (text.startsWith('aborted')) {
    return { visible: true, indeterminate: false, showPercent: false, fraction: 1, label: 'SCAN ABORTED', danger: true };
  }
  if (text.startsWith('done:')) {
    return { visible: true, indeterminate: false, fraction: 1, label: 'SCAN COMPLETE', danger: false };
  }
  if (text === 'homing' || text === 'sweep_homing') {
    return { visible: true, indeterminate: true, fraction: 0, label: 'HOMING', danger: false };
  }
  // idle, disconnected, or anything unrecognized -- nothing to announce.
  return { visible: false };
}

function updateScanProgress(text) {
  const info = parseScanStatus(text);
  const pct = !info.visible ? 0 : (info.indeterminate ? 100 : Math.round(info.fraction * 100));
  const banner = document.getElementById('scanBanner');
  banner.classList.toggle('visible', info.visible);
  banner.classList.toggle('indeterminate', !!info.indeterminate);
  banner.classList.toggle('danger', !!info.danger);
  if (!info.visible) return;
  document.getElementById('scanBannerFill').style.width = pct + '%';
  document.getElementById('scanBannerText').textContent =
    (!info.indeterminate && info.showPercent !== false) ? `${info.label} — ${pct}%` : info.label;
}

function subscribeScanStatusTopic() {
  bridge.subscribe(SCAN_NODE + '/status', 'std_msgs/msg/String', (msg) => {
    document.getElementById('stScan').textContent = msg.data;
    lastScanStatusText = msg.data;
    updateScanProgress(msg.data);
  });
}

function motorStatusName(v) {
  return { 0: 'QueryFailed', 1: 'Stopped', 2: 'SpeedingUp', 3: 'SpeedingDown', 4: 'FullSpeed', 5: 'Homing', 6: 'Calibrating' }[v] ?? v;
}

let pollActive = false;

async function pollOnce() {
  try {
    const status = await sendDriverCommand('read_motor_status', {});
    document.getElementById('stMotorStatus').textContent = motorStatusName(status);
  } catch (e) {}
  try {
    const enabled = await sendDriverCommand('read_enable_status', {});
    document.getElementById('stEnable').textContent = enabled ? 'enabled' : 'disabled';
  } catch (e) {}
  try {
    const speed = await sendDriverCommand('read_speed', {});
    document.getElementById('stSpeed').textContent = speed + ' RPM';
  } catch (e) {}
  try {
    const stalled = await sendDriverCommand('read_stall_status', {});
    document.getElementById('stStall').textContent = stalled ? 'STALLED' : 'ok';
  } catch (e) {}
}

async function pollLoop() {
  while (pollActive) {
    await pollOnce();
    await sleep(1500);
  }
}

function startPolling() {
  if (pollActive) return;
  pollActive = true;
  pollLoop();
}
function stopPolling() {
  pollActive = false;
}

// ---- Emergency Stop / Shutdown ----

document.getElementById('stopBtn').addEventListener('click', async () => {
  try {
    const result = await bridge.callService(TILT_NODE + '/stop', 'std_srvs/srv/Trigger', {});
    setFeedback('stop -> ' + JSON.stringify(result));
  } catch (e) { setFeedback('stop failed: ' + e.message, true); }
});

document.getElementById('shutdownStackBtn').addEventListener('click', async () => {
  if (!confirm('Shut down the scanner stack AND power off the Pi itself? This page will lose connection, and the Pi will need to be physically powered back on to use again.')) {
    return;
  }
  try {
    const result = await bridge.callService(TILT_NODE + '/shutdown_stack', 'std_srvs/srv/Trigger', {});
    setFeedback('shutdown_stack -> ' + JSON.stringify(result));
  } catch (e) {
    setFeedback('shutdown_stack: connection dropped (expected if the stack actually went down)', true);
  }
});

// ---- Tab switching ----

const topPages = ['tab-config', 'tab-scans', 'tab-settings'];
document.querySelectorAll('nav.tabs > button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs > button').forEach((b) => b.classList.remove('active'));
    topPages.forEach((id) => document.getElementById(id).classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'scans') refreshScansList();
  });
});

// ---- Project selection/creation -- same naming convention as the full
// GUI (auto-names every scan "<project>_<timestamp>"), same mechanism:
// the dropdown lists whatever projects already have a real saved scan
// (parsed from the Scans list), plus whatever's been picked this session. ----

const pendingListLocalScansRequests = new Map();
let listLocalScansResponseSubscribed = false;
let listLocalScansReqCounter = 0;

function ensureListLocalScansResponseSubscription() {
  if (listLocalScansResponseSubscribed) return;
  listLocalScansResponseSubscribed = true;
  bridge.subscribe(SCAN_NODE + '/list_local_scans_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingListLocalScansRequests.get(resp.id);
    if (pending) {
      pendingListLocalScansRequests.delete(resp.id);
      clearTimeout(pending.timer);
      pending.resolve(resp);
    }
  });
}

function requestListLocalScans() {
  ensureListLocalScansResponseSubscription();
  const id = 'lslocal_' + (++listLocalScansReqCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingListLocalScansRequests.delete(id);
      reject(new Error('list_local_scans timed out'));
    }, 3000);
    pendingListLocalScansRequests.set(id, { resolve, reject, timer });
    bridge.publish(SCAN_NODE + '/list_local_scans_request', 'std_msgs/msg/String', {
      data: JSON.stringify({ id }),
    });
  });
}

function sanitizeProjectName(text) {
  const collapsed = text.trim().replace(/\s+/g, '_');
  return collapsed.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60);
}

function parseProjectName(name) {
  const m = /^(.+)_\d{8}_\d{6}\.e57$/i.exec(name);
  return m ? m[1] : null;
}

function selectProjectOption(name) {
  const select = document.getElementById('projectSelect');
  if (name && !Array.from(select.options).some((o) => o.value === name)) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  }
  select.value = name || '';
}

async function refreshProjectDropdown() {
  const select = document.getElementById('projectSelect');
  const current = select.value;
  try {
    const resp = await requestListLocalScans();
    if (resp.error || !resp.scans) return;
    const projects = new Set();
    resp.scans.forEach((scan) => {
      const project = parseProjectName(scan.name);
      if (project) projects.add(project);
    });
    select.innerHTML = '';
    const noneOpt = document.createElement('option');
    noneOpt.value = '';
    noneOpt.textContent = '(no project)';
    select.appendChild(noneOpt);
    Array.from(projects).sort().forEach((project) => {
      const opt = document.createElement('option');
      opt.value = project;
      opt.textContent = project;
      select.appendChild(opt);
    });
    selectProjectOption(current);
  } catch (e) {
    setFeedback('failed to refresh project list: ' + e.message, true);
  }
}

document.getElementById('newProjectBtn').addEventListener('click', () => {
  const typed = prompt('New project name (e.g. venue or job name):');
  if (!typed) return;
  const name = sanitizeProjectName(typed);
  if (!name) {
    setFeedback('project name is empty after removing spaces/punctuation -- not added', true);
    return;
  }
  selectProjectOption(name);
  setFeedback(`new project selected: ${name} (takes effect on next Start Scan)`);
});

function sessionParams() {
  return [
    { name: 'project_name', value: { type: PARAMETER_STRING, string_value: document.getElementById('projectSelect').value } },
  ];
}

// ---- Settings file (~/.lidar_scanner_settings.json) request/response --
// backs scan presets, same shared file the full GUI's own presets and
// Save/Load Settings use. ----

const DEFAULT_SETTINGS_PATH = '~/.lidar_scanner_settings.json';
const pendingSettingsFileRequests = new Map();
let settingsFileResponsesSubscribed = false;
let settingsFileReqCounter = 0;

function ensureSettingsFileResponseSubscriptions() {
  if (settingsFileResponsesSubscribed) return;
  settingsFileResponsesSubscribed = true;
  const onResponse = (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingSettingsFileRequests.get(resp.id);
    if (pending) {
      pendingSettingsFileRequests.delete(resp.id);
      clearTimeout(pending.timer);
      pending.resolve(resp);
    }
  };
  bridge.subscribe(TILT_NODE + '/read_settings_file_response', 'std_msgs/msg/String', onResponse);
  bridge.subscribe(TILT_NODE + '/write_settings_file_response', 'std_msgs/msg/String', onResponse);
}

function requestReadSettingsFile(path) {
  ensureSettingsFileResponseSubscriptions();
  const id = 'read_settings_' + (++settingsFileReqCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingSettingsFileRequests.delete(id);
      reject(new Error('read timed out'));
    }, 5000);
    pendingSettingsFileRequests.set(id, { resolve, reject, timer });
    bridge.publish(TILT_NODE + '/read_settings_file_request', 'std_msgs/msg/String', {
      data: JSON.stringify({ id, path }),
    });
  });
}

function requestWriteSettingsFile(path, content) {
  ensureSettingsFileResponseSubscriptions();
  const id = 'write_settings_' + (++settingsFileReqCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingSettingsFileRequests.delete(id);
      reject(new Error('write timed out'));
    }, 5000);
    pendingSettingsFileRequests.set(id, { resolve, reject, timer });
    bridge.publish(TILT_NODE + '/write_settings_file_request', 'std_msgs/msg/String', {
      data: JSON.stringify({ id, path, content }),
    });
  });
}

async function readDefaultSettingsFileOrEmpty() {
  try {
    const resp = await requestReadSettingsFile(DEFAULT_SETTINGS_PATH);
    if (!resp.error && resp.content) return resp.content;
  } catch (e) {}
  return {};
}

// ---- Named presets: generic save/load/delete against one dict inside
// the shared settings file, same as the full GUI's own (scan_presets
// here specifically) ----

async function refreshPresetSelect(selectId, presetsKey, selectName) {
  const select = document.getElementById(selectId);
  const existing = await readDefaultSettingsFileOrEmpty();
  const names = Object.keys(existing[presetsKey] || {}).sort((a, b) => a.localeCompare(b));
  const toSelect = selectName !== undefined ? selectName : select.value;
  select.innerHTML = '';
  if (!names.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(no presets saved)';
    select.appendChild(opt);
  } else {
    names.forEach((name) => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
    if (names.includes(toSelect)) select.value = toSelect;
  }
  return names;
}

async function saveNamedPresetAs(presetsKey, assembleFn, selectId) {
  if (!bridge.connected) { setFeedback('connect to rosbridge before saving a preset', true); return; }
  const name = (prompt('Name for this preset:') || '').trim();
  if (!name) return;
  try {
    const existing = await readDefaultSettingsFileOrEmpty();
    existing[presetsKey] = existing[presetsKey] || {};
    if (name in existing[presetsKey] && !confirm(`A preset named "${name}" already exists -- overwrite it?`)) {
      return;
    }
    existing[presetsKey][name] = await assembleFn();
    await requestWriteSettingsFile(DEFAULT_SETTINGS_PATH, existing);
    await refreshPresetSelect(selectId, presetsKey, name);
    setFeedback(`preset "${name}" saved`);
  } catch (e) {
    setFeedback('save preset failed: ' + e.message, true);
  }
}

async function loadNamedPreset(presetsKey, applyFn, selectId) {
  if (!bridge.connected) { setFeedback('connect to rosbridge before loading a preset', true); return; }
  const name = document.getElementById(selectId).value;
  if (!name) { setFeedback('no preset selected', true); return; }
  try {
    const existing = await readDefaultSettingsFileOrEmpty();
    const content = (existing[presetsKey] || {})[name];
    if (!content) { setFeedback(`preset "${name}" not found`, true); return; }
    await applyFn(content);
    setFeedback(`preset "${name}" loaded`);
  } catch (e) {
    setFeedback('load preset failed: ' + e.message, true);
  }
}

async function deleteNamedPreset(presetsKey, selectId) {
  if (!bridge.connected) { setFeedback('connect to rosbridge before deleting a preset', true); return; }
  const name = document.getElementById(selectId).value;
  if (!name) return;
  if (!confirm(`Delete preset "${name}"? This can't be undone.`)) return;
  try {
    const existing = await readDefaultSettingsFileOrEmpty();
    if (existing[presetsKey]) delete existing[presetsKey][name];
    await requestWriteSettingsFile(DEFAULT_SETTINGS_PATH, existing);
    await refreshPresetSelect(selectId, presetsKey);
    setFeedback(`preset "${name}" deleted`);
  } catch (e) {
    setFeedback('delete preset failed: ' + e.message, true);
  }
}

// Scan preset here covers scan_aggregator's stare/sweep fields only --
// unlike the full GUI's own scan preset, there's no VLP-16 capture-
// window UI on this simplified page to carry along, so that section is
// simply absent from what gets saved/applied here (harmless: a preset
// saved by the full GUI still loads fine here, its vlp16_config section
// is just ignored; a preset saved here still loads fine there too).
function assembleScanPreset() {
  return {
    scan_aggregator: {
      tilt_start_deg: parseFloat(document.getElementById('scanStartDeg').value),
      tilt_end_deg: parseFloat(document.getElementById('scanEndDeg').value),
      step_deg: parseFloat(document.getElementById('scanStepDeg').value),
      revolutions_per_stop: parseFloat(document.getElementById('scanRevsPerStop').value),
      settle_extra_s: parseFloat(document.getElementById('scanSettleExtra').value),
      sweep_min_deg: parseFloat(document.getElementById('sweepScanMinDeg').value),
      sweep_max_deg: parseFloat(document.getElementById('sweepScanMaxDeg').value),
      sweep_speed_rpm: parseInt(document.getElementById('sweepScanSpeedRpm').value, 10),
      sweep_accel: parseInt(document.getElementById('sweepScanAccel').value, 10),
      sweep_duration_s: parseFloat(document.getElementById('sweepScanDurationS').value),
      sweep_edge_margin_deg: parseFloat(document.getElementById('sweepScanEdgeMarginDeg').value),
      enable_sweep_deskew: document.getElementById('sweepEnableDeskew').checked,
    },
  };
}

function applyScanAggregatorSettingsToForm(section) {
  if ('project_name' in section) selectProjectOption(section.project_name);
  if ('tilt_start_deg' in section) document.getElementById('scanStartDeg').value = section.tilt_start_deg;

async function setParametersFromObject(nodeName, values, typeMap) {
  const parameters = Object.entries(values)
    .filter(([name]) => name in typeMap)
    .map(([name, value]) => {
      const kind = typeMap[name];
      if (kind === 'bool') return { name, value: { type: PARAMETER_BOOL, bool_value: !!value } };
      if (kind === 'int') return { name, value: { type: PARAMETER_INTEGER, integer_value: Math.trunc(value) } };
      if (kind === 'float') return { name, value: { type: PARAMETER_DOUBLE, double_value: value } };
      return { name, value: { type: PARAMETER_STRING, string_value: String(value) } };
    });
  if (!parameters.length) return;
  const result = await bridge.callService(
    nodeName + '/set_parameters', 'rcl_interfaces/srv/SetParameters', { parameters }
  );
  const failed = (result.results || []).find((r) => !r.successful);
  if (failed) throw new Error(failed.reason || 'set_parameters rejected');
}

// ---- Live coverage ----

function renderCoverage(payload) {
  const canvas = document.getElementById('coverageCanvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const counts = payload.counts || [];
  const n = counts.length;
  const summaryEl = document.getElementById('coverageSummary');
  if (!n) {
    if (summaryEl) summaryEl.textContent = '—';
    return;
  }
  const startDeg = payload.start_deg;
  const binDeg = payload.bin_deg;

  const cx = w / 2;
  const cy = h / 2;
  const rOuterMax = Math.min(w, h) / 2 - 2;
  const rInner = rOuterMax * 0.35;
  ctx.lineWidth = Math.max(1.5, ((2 * Math.PI * rOuterMax) / 360) * binDeg * 0.8);
  ctx.lineCap = 'round';

  let covered = 0;
  for (let i = 0; i < n; i++) {
    const c = counts[i];
    if (c > 0) covered++;
    const tiltDeg = startDeg + i * binDeg;
    const angle = ((tiltDeg - 90) * Math.PI) / 180;
    const intensity = Math.min(1, c / 3);
    const rOuter = c === 0 ? rInner + 3 : rInner + intensity * (rOuterMax - rInner);
    ctx.strokeStyle = c === 0 ? '#2f4038' : `rgba(43, 227, 129, ${0.35 + intensity * 0.65})`;
    ctx.beginPath();
    ctx.moveTo(cx + rInner * Math.cos(angle), cy + rInner * Math.sin(angle));
    ctx.lineTo(cx + rOuter * Math.cos(angle), cy + rOuter * Math.sin(angle));
    ctx.stroke();
  }

  const endDeg = startDeg + binDeg * (n - 1);
  const pct = Math.round((covered / n) * 100);
  if (summaryEl) {
    summaryEl.textContent = `${covered}/${n} captured (${pct}%) ${startDeg.toFixed(1)}°..${endDeg.toFixed(1)}°`;
  }
}

function subscribeCoverageTopic() {
  bridge.subscribe(SCAN_NODE + '/coverage', 'std_msgs/msg/String', (msg) => {
    let payload;
    try { payload = JSON.parse(msg.data); } catch (e) { return; }
    renderCoverage(payload);
  });
}

const PREVIEW_SWEEP_ENDPOINTS = 4; // 2 full back-and-forth round trips
let previewSweepCancel = false;

async function runPreviewSweep() {
  if (parseScanStatus(lastScanStatusText).visible) {
    setFeedback('preview sweep: a real scan is already running, not starting', true);
    return;
  }

  const minDeg = parseFloat(document.getElementById('sweepScanMinDeg').value);
  const maxDeg = parseFloat(document.getElementById('sweepScanMaxDeg').value);
  const speedRpm = parseInt(document.getElementById('sweepScanSpeedRpm').value, 10);
  const accel = parseInt(document.getElementById('sweepScanAccel').value, 10);
  const statusEl = document.getElementById('previewSweepStatus');

  if (!(maxDeg > minDeg)) {
    setFeedback('preview sweep: Min must be < Max', true);
    return;
  }

  previewSweepCancel = false;
  document.getElementById('previewSweepBtn').disabled = true;
  document.getElementById('stopPreviewSweepBtn').disabled = false;

  try {
    await setSweepParams(minDeg, maxDeg, speedRpm, accel);
  } catch (e) {
    setFeedback('preview sweep: failed to set sweep params: ' + e.message, true);
    document.getElementById('previewSweepBtn').disabled = false;
    document.getElementById('stopPreviewSweepBtn').disabled = true;
    return;
  }

  statusEl.textContent = `previewing ${minDeg}-${maxDeg}deg...`;
  bridge.publish(TILT_NODE + '/sweep_enable', 'std_msgs/msg/Bool', { data: true });

  let endpoints = 0;
  let prevState = document.getElementById('stState').textContent;
  const deadline = Date.now() + 120000;

  while (Date.now() < deadline && !previewSweepCancel && endpoints < PREVIEW_SWEEP_ENDPOINTS) {
    await sleep(150);
    const cur = document.getElementById('stState').textContent;
    if (prevState === 'sweeping' && cur === 'settling') {
      endpoints++;
      statusEl.textContent = `previewing ${minDeg}-${maxDeg}deg... pass ${Math.ceil(endpoints / 2)}/${Math.ceil(PREVIEW_SWEEP_ENDPOINTS / 2)}`;
    }
    prevState = cur;
  }

  bridge.publish(TILT_NODE + '/sweep_enable', 'std_msgs/msg/Bool', { data: false });
  statusEl.textContent = previewSweepCancel
    ? 'stopped'
    : (endpoints >= PREVIEW_SWEEP_ENDPOINTS ? 'done' : 'stopped (timed out waiting for status)');
  document.getElementById('previewSweepBtn').disabled = false;
  document.getElementById('stopPreviewSweepBtn').disabled = true;
}

document.getElementById('previewSweepBtn').addEventListener('click', () => { runPreviewSweep(); });
document.getElementById('stopPreviewSweepBtn').addEventListener('click', () => {
  previewSweepCancel = true;
});

// ---- MKS driver / VLP-16 hardware "settings" replay -- backs Save/Load
// Settings and Config preset's mks_driver/vlp16_hardware sections. This
// page has no raw driver-command form (that lives only on the full GUI's
// Motor/VLP-16 Config tabs), so the *assemble* side of this always comes
// back empty here (getDriverSettingCommands/getVlp16SettingCommands find
// zero matching buttons in this page's DOM, by design) -- a file/preset
// saved from this page just won't carry those two sections. The *apply*
// side is unaffected by that: it replays whatever a preset/file already
// contains straight to the driver, live, with no dependency on a
// matching form existing here, so loading something the full GUI saved
// (raw MKS config, sensor network settings, etc.) still works correctly
// from this page. ----

const MKS_DRIVER_SETTING_COMMANDS = new Set([
  'set_work_mode', 'set_working_current', 'set_microstep', 'set_slave_address',
  'set_enable_pin_level', 'set_direction', 'set_auto_screen_off',
  'set_overcurrent_protect', 'set_microstep_interpolation', 'set_baud_rate',
  'set_holding_current_percent',
  'set_position_protect', 'set_heartbeat_protect_time',
  'set_home_params', 'set_home_torque_offset', 'set_single_turn_zero_return',
  'set_position_threshold', 'set_limit_port_remap',
  'set_pid_close',
  'set_respond_and_active', 'set_group_address', 'set_modbus_rtu',
  'set_key_lock', 'set_auto_run_on_power_on',
]);
const VLP16_HW_SETTING_COMMANDS = new Set(['set_rpm', 'set_returns', 'set_fov', 'set_net', 'set_host']);

function resolveParams(template) {
  const out = {};
  for (const [key, spec] of Object.entries(template)) {
    if (typeof spec === 'string' && spec.startsWith('#')) {
      const [selector, type] = spec.slice(1).split(':');
      const el = document.getElementById(selector);
      let val;
      if (type === 'bool') val = el.checked;
      else if (type === 'int') val = parseInt(el.value, 10);
      else if (type === 'float') val = parseFloat(el.value);
      else val = el.value;
      out[key] = val;
    } else {
      out[key] = spec;
    }
  }
  return out;
}

function getDriverSettingCommands() {
  return Array.from(document.querySelectorAll('button[data-cmd]'))
    .filter((btn) => MKS_DRIVER_SETTING_COMMANDS.has(btn.dataset.cmd))
    .map((btn) => ({ command: btn.dataset.cmd, template: btn.dataset.params ? JSON.parse(btn.dataset.params) : {} }));
}
function getVlp16SettingCommands() {
  return Array.from(document.querySelectorAll('button[data-vlp16cmd]'))
    .filter((btn) => VLP16_HW_SETTING_COMMANDS.has(btn.dataset.vlp16cmd))
    .map((btn) => ({ command: btn.dataset.vlp16cmd, template: btn.dataset.vlp16params ? JSON.parse(btn.dataset.vlp16params) : {} }));
}
function assembleMksDriverSettings() {
  const out = {};
  for (const { command, template } of getDriverSettingCommands()) out[command] = resolveParams(template);
  return out;
}
function assembleVlp16HwSettings() {
  const out = {};
  for (const { command, template } of getVlp16SettingCommands()) out[command] = resolveParams(template);
  return out;
}

// Retries a couple of times before giving up -- same reasoning as the
// full GUI's own copy: a brief transient disconnect at the exact moment
// a Load replays these commands shouldn't need the user to notice and
// retry by hand.
async function sendWithRetry(fn, description, attempts = 3, delayMs = 1500) {
  let lastError;
  for (let i = 0; i < attempts; i++) {
    try {
      return await fn();
    } catch (e) {
      lastError = e;
      if (i < attempts - 1) await sleep(delayMs);
    }
  }
  throw lastError;
}

async function applyMksDriverSettingsLive(mksDriverSection) {
  for (const [command, params] of Object.entries(mksDriverSection)) {
    try {
      await sendWithRetry(() => sendDriverCommand(command, params), command);
    } catch (e) {
      setFeedback(`failed to apply persisted ${command}: ${e.message}`, true);
    }
  }
}

let vlp16CmdCounter = 0;
const pendingVlp16Commands = new Map();
let vlp16ResponseSubscribed = false;
function ensureVlp16ResponseSubscription() {
  if (vlp16ResponseSubscribed) return;
  vlp16ResponseSubscribed = true;
  bridge.subscribe(VLP16_NODE + '/hw_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingVlp16Commands.get(resp.id);
    if (pending) {
      pendingVlp16Commands.delete(resp.id);
      clearTimeout(pending.timer);
      if (resp.success) pending.resolve(resp.result);
      else pending.reject(new Error(resp.error || 'command failed'));
    }
  });
}
function sendVlp16Command(command, params) {
  ensureVlp16ResponseSubscription();
  const id = 'vlp16cmd_' + (++vlp16CmdCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingVlp16Commands.delete(id);
      reject(new Error('timed out: ' + command));
    }, 5000);
    pendingVlp16Commands.set(id, { resolve, reject, timer });
    bridge.publish(VLP16_NODE + '/hw_command', 'std_msgs/msg/String', {
      data: JSON.stringify({ id, command, params }),
    });
  });
}
async function applyVlp16HwSettingsLive(vlp16HwSection) {
  for (const [command, params] of Object.entries(vlp16HwSection)) {
    try {
      await sendWithRetry(() => sendVlp16Command(command, params), command);
    } catch (e) {
      setFeedback(`failed to apply persisted vlp16 ${command}: ${e.message}`, true);
    }
  }
}

  document.getElementById('mountCalibrationSummary').textContent =
    `roll ${resp.initial_roll_deg.toFixed(3)} -> ${resp.roll_deg.toFixed(3)} deg, ` +
    `pitch ${resp.initial_pitch_deg.toFixed(3)} -> ${resp.pitch_deg.toFixed(3)} deg -- ` +
    `RMS ${resp.before_rms_mm.toFixed(2)}mm -> ${resp.after_rms_mm.toFixed(2)}mm ` +
    `(${resp.n_points} points, ${resp.tilt_range_deg.toFixed(0)} deg tilt range)`;
  resultEl.hidden = false;
  setFeedback(`mount calibration result: ${document.getElementById('mountCalibrationSummary').textContent}`);
  if (autoApplyNextMountCalibration) {
    autoApplyNextMountCalibration = false;
    applyMountCalibrationResult(resp);
  }
}

function subscribeMountCalibrationResponseTopic() {
  bridge.subscribe(SCAN_NODE + '/mount_calibration_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    renderMountCalibrationResult(resp);
  });
}

async function applyMountCalibrationResult(resp) {
  const parameters = [
    { name: 'mount_roll_deg', value: { type: PARAMETER_DOUBLE, double_value: resp.roll_deg } },
    { name: 'mount_pitch_deg', value: { type: PARAMETER_DOUBLE, double_value: resp.pitch_deg } },
  ];
  try {
    const result = await bridge.callService(VLP16_NODE + '/set_parameters', 'rcl_interfaces/srv/SetParameters', { parameters });
    const failed = (result.results || []).find((r) => !r.successful);
    if (failed) throw new Error(failed.reason || 'set_parameters rejected');
    setFeedback(`mount calibration applied: roll=${resp.roll_deg.toFixed(3)} pitch=${resp.pitch_deg.toFixed(3)}`);
    const applyBtn = document.getElementById('applyMountCalibrationBtn');
    applyBtn.disabled = true;
    applyBtn.textContent = 'Applied';
  } catch (e) {
    setFeedback('failed to apply mount calibration: ' + e.message, true);
  }
}

document.getElementById('applyMountCalibrationBtn').addEventListener('click', () => {
  if (!lastMountCalibrationResult) return;
  applyMountCalibrationResult(lastMountCalibrationResult);
});

// ---- Settings file (Save/Load) + Config preset -- Save Settings As/Load
// Settings round-trip everything (tilt_axis_bridge, scan_aggregator,
// mks_driver, vlp16_config, vlp16_hardware, plus both preset libraries)
// in one file; Config preset is the same idea for just the
// tilt_axis_bridge/mks_driver/vlp16_hardware/non-scan-vlp16_config subset
// -- see MKS driver/VLP-16 hardware comment above for why assembling
// those two sections always comes back empty from this page specifically
// (no raw-command form here), while applying them still works fully. ----

async function assembleFullSettings() {
  const tilt = await getParametersAsObject(TILT_NODE, TILT_AXIS_BRIDGE_PARAM_TYPES);
  const scan = await getParametersAsObject(SCAN_NODE, SCAN_AGGREGATOR_PARAM_TYPES);
  const mks = assembleMksDriverSettings();
  const vlp16 = await getParametersAsObject(VLP16_NODE, VLP16_CONFIG_PARAM_TYPES);
  const vlp16Hw = assembleVlp16HwSettings();
  const existing = await readDefaultSettingsFileOrEmpty();
  return {
    tilt_axis_bridge: tilt, scan_aggregator: scan, mks_driver: mks,
    vlp16_config: vlp16, vlp16_hardware: vlp16Hw,
    scan_presets: existing.scan_presets || {},
    config_presets: existing.config_presets || {},
  };
}

async function applyFullSettings(content) {
  if (content.tilt_axis_bridge) {
    await setParametersFromObject(TILT_NODE, content.tilt_axis_bridge, TILT_AXIS_BRIDGE_PARAM_TYPES);
  }
  if (content.scan_aggregator) {
    applyScanAggregatorSettingsToForm(content.scan_aggregator);
    await setParametersFromObject(SCAN_NODE, content.scan_aggregator, SCAN_AGGREGATOR_PARAM_TYPES);
  }
  if (content.mks_driver) await applyMksDriverSettingsLive(content.mks_driver);
  if (content.vlp16_config) {
    await setParametersFromObject(VLP16_NODE, content.vlp16_config, VLP16_CONFIG_PARAM_TYPES);
  }
  if (content.vlp16_hardware) await applyVlp16HwSettingsLive(content.vlp16_hardware);
}

async function assembleConfigPreset() {
  const tilt = await getParametersAsObject(TILT_NODE, TILT_AXIS_BRIDGE_PARAM_TYPES);
  const mks = assembleMksDriverSettings();
  const vlp16Full = await getParametersAsObject(VLP16_NODE, VLP16_CONFIG_PARAM_TYPES);
  const vlp16 = {};
  Object.entries(vlp16Full).forEach(([name, value]) => {
    if (!VLP16_SCAN_PARAM_NAMES.includes(name)) vlp16[name] = value;
  });
  const vlp16Hw = assembleVlp16HwSettings();
  return { tilt_axis_bridge: tilt, mks_driver: mks, vlp16_config: vlp16, vlp16_hardware: vlp16Hw };
}

async function applyConfigPreset(content) {
  if (content.tilt_axis_bridge) {
    await setParametersFromObject(TILT_NODE, content.tilt_axis_bridge, TILT_AXIS_BRIDGE_PARAM_TYPES);
  }
  if (content.mks_driver) await applyMksDriverSettingsLive(content.mks_driver);
  if (content.vlp16_config) {
    await setParametersFromObject(VLP16_NODE, content.vlp16_config, VLP16_CONFIG_PARAM_TYPES);
  }
  if (content.vlp16_hardware) await applyVlp16HwSettingsLive(content.vlp16_hardware);
}

// mergeSections: loading a preset only ever covers a subset of sections
// (and, for vlp16_config, a subset of one section's own fields) --
// writing it straight over the whole default file the way Load Settings
// does would blow away whatever the other preset type had left there.
// Merge field-by-field per section instead, so mks_driver/vlp16_hardware
// (no ROS-parameter self-persist of their own) still get remembered for
// next real startup.
async function mergeSectionsIntoDefaultSettingsFile(partialContent) {
  const existing = await readDefaultSettingsFileOrEmpty();
  Object.entries(partialContent).forEach(([section, fields]) => {
    existing[section] = Object.assign({}, existing[section] || {}, fields);
  });
  await requestWriteSettingsFile(DEFAULT_SETTINGS_PATH, existing);
}

// ---- Settings file browser modal (list_dir_request/response) --
// backs Save Settings As/Load Settings, direct copy of the full GUI's
// own mechanism (browsers can't show a native folder picker that hands
// back a real filesystem path on a different machine, so this is an
// in-page browser against scan_aggregator's own list_dir service). ----

const pendingListDirRequests = new Map();
let listDirResponseSubscribed = false;
let listDirReqCounter = 0;

function ensureListDirResponseSubscription() {
  if (listDirResponseSubscribed) return;
  listDirResponseSubscribed = true;
  bridge.subscribe(SCAN_NODE + '/list_dir_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingListDirRequests.get(resp.id);
    if (pending) {
      pendingListDirRequests.delete(resp.id);
      clearTimeout(pending.timer);
      pending.resolve(resp);
    }
  });
}

function requestListDir(path, newFolder, fileFilter) {
  ensureListDirResponseSubscription();
  const id = 'lsdir_' + (++listDirReqCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingListDirRequests.delete(id);
      reject(new Error('list_dir timed out'));
    }, 3000);
    pendingListDirRequests.set(id, { resolve, reject, timer });
    const req = { id, path };
    if (newFolder) req.new_folder = newFolder;
    if (fileFilter) req.file_filter = fileFilter;
    bridge.publish(SCAN_NODE + '/list_dir_request', 'std_msgs/msg/String', { data: JSON.stringify(req) });
  });
}

let settingsFileMode = 'load';
let settingsFileCurrentPath = '~';
let settingsFileParentPath = null;
let settingsFileOnPathChosen = null;
let settingsFileOnContentLoaded = null;

function openSettingsFileModal(mode, callback, options) {
  options = options || {};
  if (!bridge.connected) {
    setFeedback('connect to rosbridge before saving/loading settings', true);
    return;
  }
  settingsFileMode = mode;
  settingsFileOnPathChosen = mode === 'save' ? callback : null;
  settingsFileOnContentLoaded = mode === 'load' ? callback : null;
  document.getElementById('settingsFileModalTitle').textContent =
    options.title || (mode === 'save' ? 'Save Settings As' : 'Load Settings');
  document.getElementById('settingsFileName').style.display = mode === 'save' ? '' : 'none';
  document.getElementById('settingsFileSaveBtn').style.display = mode === 'save' ? '' : 'none';
  document.getElementById('settingsFileName').value = mode === 'save' ? (options.defaultName || 'settings.json') : '';
  document.getElementById('settingsFileModal').style.display = 'flex';
  settingsFileBrowseTo(options.startPath || '~', options.ensureFolder || null);
}

function closeSettingsFileModal() {
  document.getElementById('settingsFileModal').style.display = 'none';
}

async function settingsFileBrowseTo(path, newFolder) {
  const listEl = document.getElementById('settingsFileList');
  const pathEl = document.getElementById('settingsFilePath');
  const countEl = document.getElementById('settingsFileCount');
  const errEl = document.getElementById('settingsFileError');
  errEl.textContent = '';
  countEl.textContent = '';
  listEl.innerHTML = '<div style="padding:6px 14px;color:var(--text-dim)">loading&hellip;</div>';
  try {
    const resp = await requestListDir(path, newFolder || null, '.json');
    if (resp.error) errEl.textContent = resp.error;
    if (!resp.path) { listEl.innerHTML = ''; return; }

    settingsFileCurrentPath = resp.path;
    settingsFileParentPath = resp.parent || null;
    pathEl.value = resp.path;
    listEl.innerHTML = '';
    const dirs = resp.entries || [];
    const files = resp.files || [];
    countEl.textContent = `${dirs.length} folders, ${files.length} .json files`;
    dirs.forEach((name) => {
      const row = document.createElement('div');
      row.className = 'folder-entry';
      row.textContent = name + '/';
      row.addEventListener('click', () => settingsFileBrowseTo(resp.path.replace(/\/$/, '') + '/' + name));
      listEl.appendChild(row);
    });
    files.forEach((name) => {
      const row = document.createElement('div');
      row.className = 'folder-entry';
      row.textContent = name;
      row.addEventListener('click', () => {
        const fullPath = resp.path.replace(/\/$/, '') + '/' + name;
        if (settingsFileMode === 'save') {
          document.getElementById('settingsFileName').value = name;
        } else {
          settingsFileLoad(fullPath);
        }
      });
      listEl.appendChild(row);
    });
    if (!dirs.length && !files.length) {
      const empty = document.createElement('div');
      empty.style.padding = '6px 14px';
      empty.style.color = 'var(--text-dim)';
      empty.textContent = '(empty)';
      listEl.appendChild(empty);
    }
  } catch (e) {
    errEl.textContent = e.message;
    listEl.innerHTML = '';
  }
}

async function settingsFileLoad(path) {
  const errEl = document.getElementById('settingsFileError');
  try {
    const resp = await requestReadSettingsFile(path);
    if (resp.error) { errEl.textContent = resp.error; return; }
    const callback = settingsFileOnContentLoaded;
    closeSettingsFileModal();
    if (callback) await callback(resp.path, resp.content);
  } catch (e) {
    errEl.textContent = e.message;
  }
}

document.getElementById('settingsFileSaveBtn').addEventListener('click', () => {

// ---- Scans tab: local-first save -> browse/download/export/delete --
// mostly a direct copy of the full GUI's own (web/tilt_axis_gui_full/
// index.html), EXCEPT the download links: the full GUI's own comment
// ("OUTPUT_DIR lives inside this page's own served folder, so download
// links are plain relative scans/<name> links") is only true for ITSELF
// -- OUTPUT_DIR is web/tilt_axis_gui_full/scans (node.py), served by
// tpl-gui-http-full.service on port 8081, not this page's own folder
// (web/tilt_axis_gui, tpl-gui-http.service, port 8080). A bare relative
// "scans/<name>" link from this page 404s (no such folder under 8080's
// own document root) -- found 2026-09-16 from a real "file wasn't
// available on site" report. Fixed by pointing download links at
// scansOrigin() (below), the same host on port 8081, mirroring
// rosbridgeUrl()'s own reasoning for computing an address instead of
// assuming this page's own origin. ----

function formatBytes(n) {
  if (n == null) return '—';
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

const pendingExportToUsbRequests = new Map();
let exportToUsbResponseSubscribed = false;
let exportToUsbReqCounter = 0;

function ensureExportToUsbResponseSubscription() {
  if (exportToUsbResponseSubscribed) return;
  exportToUsbResponseSubscribed = true;
  bridge.subscribe(SCAN_NODE + '/export_to_usb_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingExportToUsbRequests.get(resp.id);
    if (pending) {
      pendingExportToUsbRequests.delete(resp.id);
      clearTimeout(pending.timer);
      pending.resolve(resp);
    }
  });
  bridge.subscribe(SCAN_NODE + '/export_to_usb_progress', 'std_msgs/msg/String', (msg) => {
    let prog;
    try { prog = JSON.parse(msg.data); } catch (e) { return; }
    const bar = document.querySelector(`.scan-entry[data-name="${CSS.escape(prog.name)}"] .scan-progress .fill`);
    const text = document.querySelector(`.scan-entry[data-name="${CSS.escape(prog.name)}"] .scan-progress-text`);
    if (bar && prog.bytes_total) bar.style.width = `${(100 * prog.bytes_copied / prog.bytes_total).toFixed(0)}%`;
    if (text) {
      text.textContent = `exporting ${prog.file_index + 1}/${prog.file_count}: ` +
        `${formatBytes(prog.bytes_copied)} / ${formatBytes(prog.bytes_total)}`;
    }
  });
}

function renderScanEntry(scan) {
  const row = document.createElement('div');
  row.className = 'scan-entry';
  row.dataset.name = scan.name;

  const name = document.createElement('span');
  name.className = 'scan-name';
  name.textContent = scan.name;

  const meta = document.createElement('span');
  meta.className = 'scan-meta';
  const when = new Date(scan.mtime * 1000).toLocaleString();
  meta.textContent = `${formatBytes(scan.size)} · ${when}${scan.exported ? ' · exported' : ''}`;

  const downloadLink = document.createElement('a');
  downloadLink.className = 'button';
  downloadLink.href = scansOrigin() + '/scans/' + encodeURIComponent(scan.name);
  downloadLink.download = scan.name;
  // target="_blank": the `download` attribute isn't guaranteed to be
  // honored for a cross-origin link (this page is 8080, scansOrigin() is
  // 8081) the way it is for the full GUI's own same-origin equivalent --
  // if a browser falls back to navigating instead, this keeps that
  // navigation off this page's own tab rather than away from the GUI.
  downloadLink.target = '_blank';
  downloadLink.rel = 'noopener';
  downloadLink.textContent = 'Download';

  const exportBtn = document.createElement('button');
  exportBtn.type = 'button';
  exportBtn.textContent = 'Export to USB';
  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true;
    deleteBtn.disabled = true;
    progress.hidden = false;
    try {
      const resp = await requestExportToUsb([scan.name]);
      const failed = (resp.results || []).find((r) => r.error);
      if (resp.error) {
        setFeedback(`export to USB failed: ${resp.error}`, true);
      } else if (failed) {
        setFeedback(`export to USB failed for ${failed.name}: ${failed.error}`, true);
      } else {
        setFeedback(`exported ${scan.name} to USB`);
      }
    } catch (e) {
      setFeedback('export to USB failed: ' + e.message, true);
    } finally {
      progress.hidden = true;
      await refreshScansList();
    }
  });

  const deleteBtn = document.createElement('button');
  deleteBtn.type = 'button';
  deleteBtn.className = 'danger';
  deleteBtn.textContent = 'Delete';
  deleteBtn.addEventListener('click', async () => {
    if (!confirm(`Delete ${scan.name} from local storage? This does not affect any already-exported USB copy.`)) return;
    exportBtn.disabled = true;
    deleteBtn.disabled = true;
    try {
      const resp = await requestDeleteLocalScan(scan.name);
      if (resp.error) {
        setFeedback(`delete failed: ${resp.error}`, true);
      } else {
        setFeedback(`deleted ${scan.name}`);
      }
    } catch (e) {
      setFeedback('delete failed: ' + e.message, true);
    } finally {
      await refreshScansList();
    }
  });

  const progress = document.createElement('div');
  progress.className = 'scan-progress';
  progress.hidden = true;
  const progressBar = document.createElement('div');
  progressBar.className = 'progress-bar';
  const progressFill = document.createElement('div');
  progressFill.className = 'fill';
  progressBar.appendChild(progressFill);
  const progressText = document.createElement('div');
  progressText.className = 'scan-progress-text';
  progressText.style.cssText = 'color:var(--text-dim);font-size:11.5px';
  progress.appendChild(progressBar);
  progress.appendChild(progressText);

  row.append(name, meta, downloadLink, exportBtn, deleteBtn, progress);
  return row;
}

function renderProjectGroup(project, scans) {
  const section = document.createElement('div');
  section.className = 'project-group';

  const header = document.createElement('div');
  header.className = 'project-group-header';
  const title = document.createElement('span');
  title.className = 'project-group-title';
  title.textContent = `${project} (${scans.length} scan${scans.length === 1 ? '' : 's'})`;
  const downloadAllBtn = document.createElement('button');
  downloadAllBtn.type = 'button';
  downloadAllBtn.textContent = 'Download All (zip)';
  downloadAllBtn.addEventListener('click', async () => {
    downloadAllBtn.disabled = true;
    const originalText = downloadAllBtn.textContent;
    downloadAllBtn.textContent = 'Zipping…';
    try {
      const resp = await requestBundleProject(project);
      if (resp.error) {
        setFeedback(`bundle failed: ${resp.error}`, true);
      } else {
        setFeedback(`bundled ${project} -> ${resp.name}`);
        const link = document.createElement('a');
        link.href = scansOrigin() + '/scans/' + encodeURIComponent(resp.name);
        link.download = resp.name;
        link.target = '_blank';
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        await refreshScansList();
        return;
      }
    } catch (e) {
      setFeedback('bundle failed: ' + e.message, true);
    }
    downloadAllBtn.disabled = false;
    downloadAllBtn.textContent = originalText;
  });
  header.append(title, downloadAllBtn);
  section.appendChild(header);

  scans.forEach((scan) => section.appendChild(renderScanEntry(scan)));
  return section;
}

async function refreshScansList() {
  const listEl = document.getElementById('scansList');
  const errEl = document.getElementById('scansListError');
  const freeEl = document.getElementById('scansFreeSpace');
  errEl.textContent = '';
  try {
    const resp = await requestListLocalScans();
    if (resp.error) { errEl.textContent = resp.error; return; }
    freeEl.textContent = `local free: ${formatBytes(resp.local_free_bytes)} · USB free: ${formatBytes(resp.usb_free_bytes)}`;
    listEl.innerHTML = '';
    if (!resp.scans || !resp.scans.length) {
      const empty = document.createElement('div');
      empty.style.color = 'var(--text-dim)';
      empty.textContent = '(no scans saved yet)';
      listEl.appendChild(empty);
      return;
    }
    const projectGroups = new Map();
    const ungrouped = [];
    resp.scans.forEach((scan) => {
      const project = parseProjectName(scan.name);
      if (!project) { ungrouped.push(scan); return; }
      if (!projectGroups.has(project)) projectGroups.set(project, []);
      projectGroups.get(project).push(scan);
    });
    projectGroups.forEach((scans, project) => listEl.appendChild(renderProjectGroup(project, scans)));
    if (projectGroups.size && ungrouped.length) {
      const heading = document.createElement('div');
      heading.className = 'project-group-title';
      heading.textContent = 'Other scans';
      listEl.appendChild(heading);
    }
    ungrouped.forEach((scan) => listEl.appendChild(renderScanEntry(scan)));
  } catch (e) {
    errEl.textContent = e.message;
  }
}

document.getElementById('refreshScansBtn').addEventListener('click', refreshScansList);

// ---- Connection handling ----
//
// No visible URL field -- this page's whole point is to be simple, and
// rosbridge is always reachable at the same host that served this page
// itself, same reasoning as status.html's own fixed address (see that
// file's own comment) rather than the full GUI's configurable one.
// location.hostname is empty when opened directly (file://), which
// falls back to localhost -- the existing desktop-dev-workflow case.

function rosbridgeUrl() {
  return `ws://${location.hostname || 'localhost'}:9090`;
}

// Same reasoning as rosbridgeUrl() above, for the full GUI's static
// file server (tpl-gui-http-full.service) instead of rosbridge -- see
// the Scans-tab comment above for why this page's own origin can't be
// used for scan download links.
function scansOrigin() {
  return `http://${location.hostname || 'localhost'}:8081`;
}

document.getElementById('connectBtn').addEventListener('click', async () => {
  if (bridge.connected) {
    bridge.disconnect();
    return;
  }
  const url = rosbridgeUrl();
  try {
    await bridge.connect(url);
    document.getElementById('connDot').classList.add('connected');
    document.getElementById('connectBtn').textContent = 'Disconnect';
    setFeedback('connected to ' + url);
    subscribeStatusTopics();
    subscribeScanStatusTopic();
    subscribeCoverageTopic();
    subscribeMountCalibrationResponseTopic();
    startPolling();
    refreshProjectDropdown();
    refreshPresetSelect('scanPresetSelect', 'scan_presets');
    refreshPresetSelect('configPresetSelect', 'config_presets');
  } catch (e) {
    setFeedback(`connection failed: could not reach ${url} (is rosbridge running there?)`, true);
  }
});

bridge.onClose = () => {
  document.getElementById('connDot').classList.remove('connected');
  document.getElementById('connectBtn').textContent = 'Connect';
  setFeedback('disconnected', true);
  stopPolling();
};

setFeedback(`Ready. Connect to begin (${rosbridgeUrl()}).`);
</script>
