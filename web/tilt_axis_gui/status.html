<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPL Status</title>
<style>
  /* Palette matches index.html's "Hardened Control Room" theme exactly --
     see index.html's :root for the source of truth if these ever diverge. */
  :root {
    --bg: #090c0a;
    --panel: #0f1512;
    --panel-border: #2f4038;
    --text: #e4efe8;
    --text-dim: #7e9488;
    --accent: #2be381;
    --accent-dim: #123d27;
    --danger: #ef4530;
    --warn: #e8b23a;
    --mono: "Consolas", "Cascadia Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; /* this is a kiosk display, not a scrolling page */
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Semibold", "Arial Narrow", sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: linear-gradient(180deg, #131c17, #0e1512);
    border-bottom: 1px solid var(--panel-border);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--danger);
    box-shadow: inset 0 0 0 1px #04140b, 0 0 3px 0 var(--danger);
    flex: none;
  }
  .dot.up { background: var(--accent); box-shadow: inset 0 0 0 1px #04140b, 0 0 4px 1px var(--accent); }
  h1 {
    margin: 0; font-size: 15px; letter-spacing: .06em; font-weight: 700;
    color: var(--text);
  }
  main {
    flex: 1;
    display: flex; flex-direction: column;
    /* Right padding is larger than the other three sides on purpose --
       this panel's physical enclosure bezel overlaps a strip of the
       right edge of the real 480x320 LCD (confirmed from real photos
       of the device, not visible in any software screenshot of the
       page -- grim captures the full framebuffer regardless of what
       the bezel physically covers), so content needs a safety margin
       there that the other edges don't. Adjust this one value if it's
       still not enough, or too much, once checked against the real
       unit -- there's no way to verify the right amount from software
       alone. */
    padding: 6px 26px 8px 10px;
    gap: 6px;
    min-height: 0;
  }
  .row {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 4px 10px;
    min-height: 0;
  }
  .label {
    font-size: 11px; letter-spacing: .08em; color: var(--text-dim);
    text-transform: uppercase;
  }
  .value {
    font-family: var(--mono); font-weight: 700; color: var(--accent);
    font-size: 22px; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .value.warn { color: var(--warn); }
  .value.danger { color: var(--danger); }
  .value.small { font-size: 15px; }

  /* Controls row -- flex:none (fixed, content-sized height) rather than
     flex:1 like the status rows above, so it takes only what it needs and
     the four status readouts keep sharing the rest of the screen equally,
     same as before this row existed. flex-wrap so a narrow/small screen
     reflows to two lines instead of clipping (this page still has
     overflow:hidden on <body>, so anything that doesn't fit some other
     way would just vanish, not scroll into view). */
  .controls {
    flex: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 5px 6px;
  }
  .controls select, .controls button {
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 6px 5px; /* still tappable at this panel's real 480x320 size */
    background: #182019;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 3px;
  }
  .controls select { flex: 1.2 1 auto; }
  .controls button { flex: 1 1 auto; white-space: nowrap; }
  .controls button:active { background: #202b23; }
  .controls button.primary { background: var(--accent-dim); border-color: var(--accent); color: #c9ffe2; }
  .controls button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .controls button.danger:active { background: var(--danger); color: #150402; }
  .controls-feedback {
    flex: none;
    font-size: 11px; color: var(--text-dim); font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 2px 0;
  }
  .controls-feedback.danger { color: var(--danger); font-style: normal; }

  /* Tab nav -- same show/hide convention as index.html's own .tabpage
     (separate copy, not shared -- see this file's own history note on
     staying a single self-contained file), just with its own small pill
     buttons sized for a touch panel instead of index.html's desktop nav. */
  .tabnav {
    flex: none;
    display: flex; gap: 4px;
  }
  .tabnav button {
    flex: 1;
    font-family: inherit; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    padding: 7px 4px;
    background: #182019; border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 3px;
  }
  .tabnav button.active { background: var(--accent-dim); border-color: var(--accent); color: #c9ffe2; }
  .tabbody { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .tabpage { display: none; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
  .tabpage.active { display: flex; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="connDot"></span>
    <h1>TPL SCANNER — STATUS</h1>
  </header>
  <main>
    <nav class="tabnav">
      <button class="tabbtn active" data-tab="status">Status</button>
      <button class="tabbtn" data-tab="control">Control</button>
      <button class="tabbtn" data-tab="scan">Scan</button>
    </nav>
    <div class="tabbody">
      <div class="tabpage active" id="tab-status">
        <div class="row">
          <div class="label">Network</div>
          <div class="value small" id="valNetwork">—</div>
        </div>
        <div class="row">
          <div class="label">Motor</div>
          <div class="value" id="valMotor">—</div>
        </div>
        <div class="row">
          <div class="label">VLP-16</div>
          <div class="value" id="valVlp16">—</div>
        </div>
        <div class="row">
          <div class="label">Scan</div>
          <div class="value small" id="valScan">—</div>
        </div>
      </div>
      <div class="tabpage" id="tab-control">
        <div class="controls">
          <select id="presetSelect"><option value="">(no presets saved)</option></select>
          <button id="calibrateBtn">Calibrate</button>
          <button id="homeBtn">Home</button>
          <button id="releaseStallBtn">Release Stall</button>
          <button id="shutdownStackBtn" class="danger">Shutdown</button>
        </div>
      </div>
      <div class="tabpage" id="tab-scan">
        <div class="row">
          <div class="label">Scan</div>
          <div class="value small" id="valScanTab">—</div>
        </div>
        <div class="row" style="flex: none; height: 76px; flex-direction: row; align-items: center; gap: 8px; justify-content: flex-start;">
          <canvas id="coverageCanvasTab" width="140" height="140" style="width: 64px; height: 64px; flex: none;"></canvas>
          <span class="value small" id="coverageSummaryTab" style="font-size: 10px; line-height: 1.4;">—</span>
        </div>
        <div class="controls">
          <select id="scanModeSelect">
            <option value="stare">Step &amp; Stare</option>
            <option value="sweep">Sweep</option>
          </select>
          <button id="startScanBtn" class="primary">Start</button>
          <button id="stopScanBtn" class="danger">Stop</button>
        </div>
      </div>
    </div>
    <div class="controls-feedback" id="controlsFeedback"></div>
  </main>

<script>
'use strict';

// Rosbridge address: this page only ever runs locally on the Pi's own
// onboard screen (see scripts/pi/ + labwc autostart), so localhost is
// always correct -- unlike index.html's location.hostname trick, which
// exists for remote/phone access to a page served over the network.
const ROSBRIDGE_URL = 'ws://localhost:9090';
const NET_INFO_URL = 'net_info.json';
const RECONNECT_DELAY_MS = 3000;
const NET_POLL_MS = 5000;

// Fixed node names -- this page only ever talks to the one local rig's
// own default nodes, unlike index.html's configurable node-name fields
// (built for pointing at a differently-named/remote setup).
const TILT_NODE = '/tilt_axis_bridge';
const SCAN_NODE = '/scan_aggregator';
const VLP16_NODE = '/vlp16_config';

const dot = document.getElementById('connDot');
const valNetwork = document.getElementById('valNetwork');
const valMotor = document.getElementById('valMotor');
const valVlp16 = document.getElementById('valVlp16');
const valScan = document.getElementById('valScan');
const valScanTab = document.getElementById('valScanTab');
const feedbackEl = document.getElementById('controlsFeedback');

// ---- Tabs: Status / Control / Scan ----
//
// Same show/hide convention as index.html's own top-level tabs (a
// separate copy, see this file's own "single self-contained file" note
// above the CSS), switched either by tapping a tab button or
// automatically -- see the scan-status subscription below, which
// switches to Scan the moment a run actually starts (from this panel,
// index.html, or a phone -- all three publish to the same status topic
// this page already subscribes to), so the live status is on screen for
// anyone glancing at the physical unit without having to tap anything.
const tabButtons = document.querySelectorAll('.tabbtn');
function switchTab(name) {
  tabButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === name));
  document.querySelectorAll('.tabpage').forEach((el) => {
    el.classList.toggle('active', el.id === 'tab-' + name);
  });
}
tabButtons.forEach((btn) => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

function setValue(el, text, cls) {
  el.textContent = text;
  el.classList.remove('warn', 'danger');
  if (cls) el.classList.add(cls);
}

function setFeedback(text, isError) {
  feedbackEl.textContent = text;
  feedbackEl.classList.toggle('danger', !!isError);
}

const MOTOR_OK = new Set(['idle', 'settled']);
const MOTOR_BAD = new Set(['stalled', 'disconnected']);
function motorClass(state) {
  if (MOTOR_BAD.has(state)) return 'danger';
  if (MOTOR_OK.has(state)) return null;
  return 'warn';
}

function scanClass(text) {
  if (text.startsWith('aborted')) return 'danger';
  if (text === 'idle' || text.startsWith('done')) return null;
  return 'warn';
}

let lastScanStatusText = null;
function isTerminalScanStatus(text) {
  return text === 'idle' || text.startsWith('done') || text.startsWith('aborted') || text === 'mount_calibration_done';
}

// Compact copy of index.html's own renderCoverage (see its own comment
// there for the full reasoning) -- a compass, not a bar: one spoke per
// tilt slice at its own real angular position (0deg at top, clockwise),
// length = revolutions captured there, only drawn where the configured/
// physical range actually reaches.
function renderCoverage(payload) {
  const canvas = document.getElementById('coverageCanvasTab');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const counts = payload.counts || [];
  const n = counts.length;
  const summaryEl = document.getElementById('coverageSummaryTab');
  if (!n) {
    if (summaryEl) summaryEl.textContent = '—';
    return;
  }
  const startDeg = payload.start_deg;
  const binDeg = payload.bin_deg;

  const cx = w / 2;
  const cy = h / 2;
  const rOuterMax = Math.min(w, h) / 2 - 2;
  const rInner = rOuterMax * 0.35;
  ctx.lineWidth = Math.max(1.5, ((2 * Math.PI * rOuterMax) / 360) * binDeg * 0.8);
  ctx.lineCap = 'round';

  let covered = 0;
  for (let i = 0; i < n; i++) {
    const c = counts[i];
    if (c > 0) covered++;
    const tiltDeg = startDeg + i * binDeg;
    const angle = ((tiltDeg - 90) * Math.PI) / 180;
    const intensity = Math.min(1, c / 3);
    const rOuter = c === 0 ? rInner + 3 : rInner + intensity * (rOuterMax - rInner);
    ctx.strokeStyle = c === 0 ? '#2f4038' : `rgba(43, 227, 129, ${0.35 + intensity * 0.65})`;
    ctx.beginPath();
    ctx.moveTo(cx + rInner * Math.cos(angle), cy + rInner * Math.sin(angle));
    ctx.lineTo(cx + rOuter * Math.cos(angle), cy + rOuter * Math.sin(angle));
    ctx.stroke();
  }

  if (summaryEl) {
    const pct = Math.round((covered / n) * 100);
    summaryEl.textContent = `${covered}/${n}\n${pct}%`;
    summaryEl.style.whiteSpace = 'pre-line';
  }
}

// ---- Minimal rosbridge client -- same protocol/shape as index.html's own
// RosBridge class (kept as a separate copy, not a shared import: this page
// has no build step and is meant to stay a single self-contained file, see
// its own history). Adds publish()/callService() on top of the previous
// subscribe-only version, needed for the controls below. ----

class RosBridge {
  constructor() {
    this.ws = null;
    this.advertised = new Set();
    this.subscriptions = new Map();
    this.pendingServices = new Map();
    this._idCounter = 0;
  }
  connect(url) {
    return new Promise((resolve, reject) => {
      this.ws = new WebSocket(url);
      this.ws.onopen = () => resolve();
      this.ws.onerror = (e) => reject(e);
      this.ws.onclose = () => { if (this.onClose) this.onClose(); };
      this.ws.onmessage = (evt) => this._onMessage(evt);
    });
  }
  get connected() {
    return this.ws && this.ws.readyState === WebSocket.OPEN;
  }
  _send(obj) {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
      throw new Error('not connected to rosbridge');
    }
    this.ws.send(JSON.stringify(obj));
  }
  _nextId() {
    this._idCounter += 1;
    return 'req_' + this._idCounter;
  }
  subscribe(topic, type, cb) {
    if (!this.subscriptions.has(topic)) {
      this.subscriptions.set(topic, []);
      this._send({ op: 'subscribe', topic, type });
    }
    this.subscriptions.get(topic).push(cb);
  }
  publish(topic, type, msg) {
    const key = topic + '|' + type;
    if (!this.advertised.has(key)) {
      this._send({ op: 'advertise', topic, type });
      this.advertised.add(key);
    }
    this._send({ op: 'publish', topic, msg });
  }
  callService(service, type, args, timeoutMs = 3000) {
    const id = this._nextId();
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        this.pendingServices.delete(id);
        reject(new Error('service call timed out: ' + service));
      }, timeoutMs);
      this.pendingServices.set(id, { resolve, reject, timer });
      this._send({ op: 'call_service', service, type, args, id });
    });
  }
  _onMessage(evt) {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    if (msg.op === 'publish') {
      const cbs = this.subscriptions.get(msg.topic);
      if (cbs) cbs.forEach((cb) => cb(msg.msg));
    } else if (msg.op === 'service_response') {
      const pending = this.pendingServices.get(msg.id);
      if (pending) {
        clearTimeout(pending.timer);
        this.pendingServices.delete(msg.id);
        if (msg.result === false) {
          pending.reject(new Error('service call failed: ' + msg.service));
        } else {
          pending.resolve(msg.values);
        }
      }
    }
  }
}

const bridge = new RosBridge();

function connect() {
  bridge.connect(ROSBRIDGE_URL).then(() => {
    dot.classList.add('up');
    bridge.subscribe(TILT_NODE + '/status', 'std_msgs/msg/String', (msg) => {
      setValue(valMotor, msg.data, motorClass(msg.data));
    });
    bridge.subscribe(VLP16_NODE + '/status', 'std_msgs/msg/String', (msg) => {
      let status;
      try { status = JSON.parse(msg.data); } catch (e) { return; }
      if (status.reachable) {
        setValue(valVlp16, 'online', null);
      } else {
        setValue(valVlp16, 'offline: ' + (status.error || 'unreachable'), 'danger');
      }
    });
    bridge.subscribe(SCAN_NODE + '/status', 'std_msgs/msg/String', (msg) => {
      setValue(valScan, msg.data, scanClass(msg.data));
      setValue(valScanTab, msg.data, scanClass(msg.data));
      if (lastScanStatusText !== null && isTerminalScanStatus(lastScanStatusText) && !isTerminalScanStatus(msg.data)) {
        switchTab('scan');
      }
      lastScanStatusText = msg.data;
    });
    bridge.subscribe(SCAN_NODE + '/mount_calibration_response', 'std_msgs/msg/String', (msg) => {
      onMountCalibrationResponse(msg);
    });
    bridge.subscribe(SCAN_NODE + '/coverage', 'std_msgs/msg/String', (msg) => {
      let payload;
      try { payload = JSON.parse(msg.data); } catch (e) { return; }
      renderCoverage(payload);
    });
    refreshPresetSelect();
  }).catch(() => {});

  bridge.onClose = () => {
    dot.classList.remove('up');
    setValue(valMotor, 'no rosbridge', 'danger');
    setValue(valVlp16, 'no rosbridge', 'danger');
    setValue(valScan, 'no rosbridge', 'danger');
    setValue(valScanTab, 'no rosbridge', 'danger');
    setTimeout(connect, RECONNECT_DELAY_MS);
  };
}

function pollNetInfo() {
  fetch(NET_INFO_URL, { cache: 'no-store' })
    .then((r) => r.json())
    .then((info) => {
      const parts = [];
      if (info.ssid) parts.push(info.ssid);
      if (info.wlan0_ip) parts.push(info.wlan0_ip);
      parts.push(':9090');
      setValue(valNetwork, parts.join(' · '), null);
    })
    .catch(() => setValue(valNetwork, 'net info unavailable', 'warn'));
}

// ---- Controls: preset select, calibrate, start step-and-stare/sweep ----
//
// Deliberately minimal compared to index.html's own equivalents: no local
// form fields to keep in sync (this page has none), so loading a preset
// just pushes its two sections' parameters straight to the live nodes --
// whatever's already configured there (from a previous index.html session,
// or a preset just loaded here) is what Step & Stare/Sweep then start
// with. Same shared settings file / same request-over-topic pattern as
// index.html's own preset and mount-calibration code, just pared down to
// what a kiosk button needs (push params, fire the service, no per-field
// UI to keep updated).

const PARAMETER_BOOL = 1;
const PARAMETER_INTEGER = 2;
const PARAMETER_DOUBLE = 3;
const PARAMETER_STRING = 4;

const SCAN_AGGREGATOR_PARAM_TYPES = {
  tilt_start_deg: 'float', tilt_end_deg: 'float', step_deg: 'float',
  revolutions_per_stop: 'float', settle_extra_s: 'float',
  sweep_min_deg: 'float', sweep_max_deg: 'float', sweep_speed_rpm: 'int',
  sweep_accel: 'int', sweep_duration_s: 'float', sweep_edge_margin_deg: 'float',
};
const VLP16_CONFIG_PARAM_TYPES = {
  min_range: 'float', max_range: 'float', view_direction: 'float', view_width: 'float',
  mount_roll_deg: 'float', mount_pitch_deg: 'float',
};

async function setParametersFromObject(nodeName, values, typeMap) {
  const parameters = Object.entries(values)
    .filter(([name]) => name in typeMap)
    .map(([name, value]) => {
      const kind = typeMap[name];
      if (kind === 'bool') return { name, value: { type: PARAMETER_BOOL, bool_value: !!value } };
      if (kind === 'int') return { name, value: { type: PARAMETER_INTEGER, integer_value: Math.trunc(value) } };
      if (kind === 'float') return { name, value: { type: PARAMETER_DOUBLE, double_value: value } };
      return { name, value: { type: PARAMETER_STRING, string_value: String(value) } };
    });
  if (!parameters.length) return;
  const result = await bridge.callService(
    nodeName + '/set_parameters', 'rcl_interfaces/srv/SetParameters', { parameters }
  );
  const failed = (result.results || []).find((r) => !r.successful);
  if (failed) throw new Error(failed.reason || 'set_parameters rejected');
}

const DEFAULT_SETTINGS_PATH = '~/.lidar_scanner_settings.json';
const pendingSettingsFileRequests = new Map();
let settingsFileResponseSubscribed = false;
let settingsFileReqCounter = 0;

function ensureSettingsFileResponseSubscription() {
  if (settingsFileResponseSubscribed) return;
  settingsFileResponseSubscribed = true;
  bridge.subscribe(TILT_NODE + '/read_settings_file_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingSettingsFileRequests.get(resp.id);
    if (pending) {
      pendingSettingsFileRequests.delete(resp.id);
      clearTimeout(pending.timer);
      pending.resolve(resp);
    }
  });
}

function requestReadSettingsFile(path) {
  ensureSettingsFileResponseSubscription();
  const id = 'read_settings_' + (++settingsFileReqCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingSettingsFileRequests.delete(id);
      reject(new Error('read timed out'));
    }, 5000);
    pendingSettingsFileRequests.set(id, { resolve, reject, timer });
    bridge.publish(TILT_NODE + '/read_settings_file_request', 'std_msgs/msg/String', {
      data: JSON.stringify({ id, path }),
    });
  });
}

async function readDefaultSettingsFileOrEmpty() {
  try {
    const resp = await requestReadSettingsFile(DEFAULT_SETTINGS_PATH);
    if (!resp.error && resp.content) return resp.content;
  } catch (e) { /* fall through */ }
  return {};
}

async function refreshPresetSelect() {
  const select = document.getElementById('presetSelect');
  const toSelect = select.value;
  let names = [];
  try {
    const existing = await readDefaultSettingsFileOrEmpty();
    names = Object.keys(existing.scan_presets || {}).sort((a, b) => a.localeCompare(b));
  } catch (e) {
    setFeedback('failed to load presets: ' + e.message, true);
  }
  select.innerHTML = '';
  if (!names.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '(no presets saved)';
    select.appendChild(opt);
  } else {
    names.forEach((name) => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
    if (names.includes(toSelect)) select.value = toSelect;
  }
}

document.getElementById('presetSelect').addEventListener('change', async (evt) => {
  const name = evt.target.value;
  if (!name) return;
  setFeedback(`loading preset "${name}"...`);
  try {
    const existing = await readDefaultSettingsFileOrEmpty();
    const content = (existing.scan_presets || {})[name];
    if (!content) throw new Error('preset not found');
    if (content.scan_aggregator) {
      await setParametersFromObject(SCAN_NODE, content.scan_aggregator, SCAN_AGGREGATOR_PARAM_TYPES);
    }
    if (content.vlp16_config) {
      await setParametersFromObject(VLP16_NODE, content.vlp16_config, VLP16_CONFIG_PARAM_TYPES);
    }
    setFeedback(`preset "${name}" loaded`);
  } catch (e) {
    setFeedback(`failed to load preset: ${e.message}`, true);
  }
});

// The _from_panel variants (not the plain ones index.html uses) -- same
// scan, just flagged server-side so its done status is worded to never
// trigger index.html's post-scan rename popup on whatever other GUI
// happens to be connected (this page has no such dialog to show it on;
// see scan_aggregator/node.py's _on_start_scan_from_panel comment).
//
// One Start button + a mode select, same collapsed shape as index.html's
// own Scan tab (see HANDOFF.md) -- there's no per-field UI to show/hide
// here though (this page has never had start/end/step or min/max/speed
// inputs of its own; whatever's already set on the live nodes, from a
// preset loaded above or from index.html, is what either mode starts
// with), so the merge is just the two buttons/handlers becoming one.
async function startStareScanFromPanel() {
  try {
    const result = await bridge.callService(SCAN_NODE + '/start_scan_from_panel', 'std_srvs/srv/Trigger', {});
    setFeedback(result.message || 'step-and-stare started');
  } catch (e) {
    setFeedback('start_scan failed: ' + e.message, true);
  }
}

async function startSweepScanFromPanel() {
  try {
    const result = await bridge.callService(SCAN_NODE + '/start_sweep_scan_from_panel', 'std_srvs/srv/Trigger', {});
    setFeedback(result.message || 'sweep started');
  } catch (e) {
    setFeedback('start_sweep_scan failed: ' + e.message, true);
  }
}

document.getElementById('startScanBtn').addEventListener('click', async () => {
  const mode = document.getElementById('scanModeSelect').value;
  if (mode === 'sweep') await startSweepScanFromPanel();
  else await startStareScanFromPanel();
});

document.getElementById('stopScanBtn').addEventListener('click', async () => {
  try {
    const result = await bridge.callService(SCAN_NODE + '/stop_scan', 'std_srvs/srv/Trigger', {});
    setFeedback(result.message || 'stop requested');
  } catch (e) {
    setFeedback('stop_scan failed: ' + e.message, true);
  }
});

// Same service index.html's own "Shutdown Everything" calls -- shuts down
// the ROS2 stack AND powers off the Pi itself (see tilt_axis_bridge's
// _on_shutdown_stack). confirm() still works fine in Chromium kiosk mode
// (a native, touch-usable dialog), so this gets the same are-you-sure
// index.html has rather than a bare one-tap poweroff.
document.getElementById('shutdownStackBtn').addEventListener('click', async () => {
  if (!confirm('Shut down the scanner stack AND power off the Pi? It will need to be physically powered back on to use again.')) {
    return;
  }
  try {
    const result = await bridge.callService(TILT_NODE + '/shutdown_stack', 'std_srvs/srv/Trigger', {});
    setFeedback(result.message || 'shutting down');
  } catch (e) {
    setFeedback('shutdown_stack: connection dropped (expected if it actually went down)', true);
  }
});

// Calibrate applies its own result automatically (no review step) --
// there's no room on this screen for index.html's before/after summary +
// separate Apply button, and this rig's mount is already known to be
// close, so a one-tap "just fix it" action fits the kiosk better than a
// two-step review flow (see index.html's own "Calibrate & Apply" for the
// equivalent choice there).
document.getElementById('calibrateBtn').addEventListener('click', async () => {
  setFeedback('calibrating -- running a sweep, this takes a minute or two...');
  try {
    await bridge.callService(SCAN_NODE + '/start_mount_calibration', 'std_srvs/srv/Trigger', {});
  } catch (e) {
    setFeedback('start_mount_calibration failed: ' + e.message, true);
  }
});

document.getElementById('homeBtn').addEventListener('click', async () => {
  try {
    const result = await bridge.callService(TILT_NODE + '/home', 'std_srvs/srv/Trigger', {});
    setFeedback(result.message || 'homing');
  } catch (e) {
    setFeedback('home failed: ' + e.message, true);
  }
});

// Minimal driver_command/driver_response round trip, scoped to just this
// one button -- index.html has a generic [data-cmd] system for its whole
// Config > Motor > Jog tab of raw driver commands, but this panel only
// ever needs the one (release_stall, relevant given this rig's
// documented stall history -- see HANDOFF.md's STATE_STALLED notes), so
// a small dedicated helper beats pulling in the generic machinery.
const pendingDriverCommands = new Map();
let driverResponseSubscribed = false;
let driverCmdCounter = 0;

function ensureDriverResponseSubscription() {
  if (driverResponseSubscribed) return;
  driverResponseSubscribed = true;
  bridge.subscribe(TILT_NODE + '/driver_response', 'std_msgs/msg/String', (msg) => {
    let resp;
    try { resp = JSON.parse(msg.data); } catch (e) { return; }
    const pending = pendingDriverCommands.get(resp.id);
    if (pending) {
      pendingDriverCommands.delete(resp.id);
      clearTimeout(pending.timer);
      if (resp.success) pending.resolve(resp.result);
      else pending.reject(new Error(resp.error || 'command failed'));
    }
  });
}

function sendDriverCommand(command, params) {
  ensureDriverResponseSubscription();
  const id = 'cmd_' + (++driverCmdCounter);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingDriverCommands.delete(id);
      reject(new Error('timed out: ' + command));
    }, 3000);
    pendingDriverCommands.set(id, { resolve, reject, timer });
    bridge.publish(TILT_NODE + '/driver_command', 'std_msgs/msg/String', {
      data: JSON.stringify({ id, command, params }),
    });
  });
}

document.getElementById('releaseStallBtn').addEventListener('click', async () => {
  try {
    await sendDriverCommand('release_stall', {});
    setFeedback('release_stall sent');
  } catch (e) {
    setFeedback('release_stall failed: ' + e.message, true);
  }
});

function onMountCalibrationResponse(msg) {
  let resp;
  try { resp = JSON.parse(msg.data); } catch (e) { return; }
  if (!resp.success) {
    setFeedback('calibration failed: ' + (resp.error || 'unknown error'), true);
    return;
  }
  setParametersFromObject(VLP16_NODE, { mount_roll_deg: resp.roll_deg, mount_pitch_deg: resp.pitch_deg }, VLP16_CONFIG_PARAM_TYPES)
    .then(() => {
      setFeedback(
        `calibrated + applied: roll ${resp.initial_roll_deg.toFixed(2)}->${resp.roll_deg.toFixed(2)}, ` +
        `pitch ${resp.initial_pitch_deg.toFixed(2)}->${resp.pitch_deg.toFixed(2)} ` +
        `(RMS ${resp.after_rms_mm.toFixed(1)}mm)`
      );
    })
    .catch((e) => setFeedback('calibration computed but failed to apply: ' + e.message, true));
}

connect();
pollNetInfo();
setInterval(pollNetInfo, NET_POLL_MS);
</script>
