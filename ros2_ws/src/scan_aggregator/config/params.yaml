scan_aggregator:
  ros__parameters:
    tilt_node_name: "/tilt_axis_bridge"
    pointcloud_topic: "/velodyne_points"
    output_frame: "base_link"
    output_dir: "~/lidar_scans"
    # ~230 deg of usable travel with a few degrees of margin off each
    # end-stop -- adjust once the real homing direction/offset is known.
    tilt_start_deg: 5.0
    tilt_end_deg: 235.0
    step_deg: 2.0
    rotation_rate_hz: 10.0
    revolutions_per_stop: 2.0
    settle_extra_s: 0.5
    homing_timeout_s: 60.0
    move_timeout_s: 30.0
    # Continuous sweep scan mode -- reuses tilt_axis_bridge's own existing
    # sweep feature, merging the point cloud live instead of at fixed stops.
    # Keep sweep_min_deg >= 0: home (0 deg) sits close to the mechanical
    # hard stop (see tilt_start_deg's 5 deg margin above), and a negative
    # bound drives the arm into that physical limit instead of a
    # controlled PID stop -- confirmed this session as a much harder halt
    # at that end than at the safe end.
    sweep_min_deg: 0.0
    sweep_max_deg: 30.0
    sweep_speed_rpm: 40  # hard-capped project-wide, see MksDriver.MAX_ALLOWED_RPM
    sweep_accel: 2
    sweep_duration_s: 0.0  # 0 = run until ~/stop_scan is called
    # Discard clouds captured within this many degrees of either sweep
    # turnaround -- the axis is changing direction there, on top of the
    # smear that's already inherent to sweep mode. 0 disables discarding.
    sweep_edge_margin_deg: 5.0
